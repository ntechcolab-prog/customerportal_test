<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Login — NETZSCH Customer Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* ── TOP BAR ─────────────────────────────────────────────── */
    .topbar {
      background: #007167;
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      flex-shrink: 0;
    }

    .topbar-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .topbar-icon { width: 16px; height: 16px; object-fit: contain; }

    .topbar-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.3);
    }

    .topbar-label {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      line-height: 24px;
      letter-spacing: -0.31px;
      white-space: nowrap;
    }

    /* ── MAIN ────────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    /* ── CARD ────────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 600px;
      border: 1.5px solid #d1d5db;
      border-radius: 40px;
      padding: 100px 100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 500;
      color: #4c4d57;
      line-height: 32px;
      letter-spacing: 0.07px;
    }

    /* Field */
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 14px;
      font-weight: 500;
      color: #4c4d57;
      line-height: 20px;
      letter-spacing: -0.15px;
    }

    .field-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      height: 40px;
      padding: 0 16px;
      transition: border-color 0.15s;
    }

    .field-input-wrap:focus-within {
      border-color: #007167;
      box-shadow: 0 0 0 3px rgba(0, 113, 103, 0.1);
    }

    .field-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #3d4246;
      background: transparent;
      min-width: 0;
    }

    .field-input::placeholder { color: #9ca3af; }

    .field-suffix {
      font-size: 14px;
      font-weight: 500;
      color: #4c4d57;
      line-height: 20px;
      letter-spacing: -0.15px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Button */
    .btn-continue {
      width: 100%;
      height: 44px;
      background: #007167;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      letter-spacing: -0.31px;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.15s;
    }

    .btn-continue:not(:disabled) {
      opacity: 1;
    }

    .btn-continue:not(:disabled):hover {
      opacity: 0.9;
    }

    .btn-continue:disabled {
      cursor: not-allowed; transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    .back-link {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #007167;
      line-height: 20px;
      letter-spacing: -0.15px;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <a href="home.html" class="topbar-link">
      <img class="topbar-icon" src="../assets/gd-logo-white.svg" alt="">
      <div class="topbar-divider"></div>
      <span class="topbar-label" data-i18n="topbar.portal">Grinding &amp; Dispersing Customer Portal</span>
    </a>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="card">

      <h2 class="card-title" data-i18n="auth.loginToAccount">Log in to your account</h2>

      <div class="field">
        <label class="field-label" for="sso-domain" data-i18n="auth.ssoDomain">Company SSO domain *</label>
        <div class="field-input-wrap">
          <input class="field-input" id="sso-domain" type="text" placeholder="your-domain" data-i18n-placeholder="auth.ssoDomainPlaceholder" autocomplete="off">
          <span class="field-suffix">.sso.com</span>
        </div>
      </div>

      <button class="btn-continue" id="btn-continue" type="button" disabled data-i18n="auth.continueBtn">Continue</button>

      <a href="login.html" class="back-link" data-i18n="auth.backToLogin">Back to Login</a>

    </div>
  </div>

  <script src="../assets/form-validation.js"></script>
  <script>
    FormValidator.init({
      fields: [
        { id: 'sso-domain', rules: ['required', 'domain'] }
      ],
      submitBtn: 'btn-continue',
      onSubmit: function () {
        window.location.href = 'login-sso-corporate.html';
      }
    });
  </script>

<script>
  window.Userback = window.Userback || {};
  Userback.access_token = "A-B6EEL5g9k8aTvbyNklnvym0W3";
  (function(d) {
    var s = d.createElement("script");s.async = true;s.src = "https://static.userback.io/widget/v1.js";(d.head || d.body).appendChild(s);
  })(document);
</script>
</body>
</html>
