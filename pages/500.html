<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something went wrong — NETZSCH Customer Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/buttons.css">
  <link rel="stylesheet" href="../assets/empty-states.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ─── */
    .topbar {
      background: #007167;
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      flex-shrink: 0;
    }
    .topbar-link { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .topbar-icon { width: 16px; height: 16px; object-fit: contain; }
    .topbar-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.3); }
    .topbar-label { font-size: 16px; font-weight: 500; color: #fff; letter-spacing: -0.31px; white-space: nowrap; }

    /* ── MAIN ─── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    /* Oversized error code above the shared empty-state block */
    .error-code {
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      color: #007167;
      letter-spacing: -1px;
      margin-bottom: 8px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .topbar { padding: 0 20px; }
      .error-code { font-size: 52px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="dashboard.html" class="topbar-link">
      <img class="topbar-icon" src="../assets/gd-logo-white.svg" alt="">
      <div class="topbar-divider"></div>
      <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
    </a>
  </div>

  <main>
    <div class="empty-state empty-state--page" role="alert">
      <p class="error-code" aria-hidden="true">500</p>
      <div class="empty-state-icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="empty-state-title">Something went wrong</h1>
      <p class="empty-state-desc">An unexpected error occurred on our side. The issue has been logged — please try again in a moment. If it persists, contact support.</p>
      <div class="empty-state-actions">
        <button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button>
        <a href="dashboard.html" class="btn btn-secondary">Back to dashboard</a>
      </div>
      <a href="contact-support.html" class="empty-state-link">Contact support</a>
    </div>
  </main>
</body>
</html>
