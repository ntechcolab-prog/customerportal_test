<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — NETZSCH Customer Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/buttons.css">
  <link rel="stylesheet" href="../assets/empty-states.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ─── */
    .topbar {
      background: #007167;
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      flex-shrink: 0;
    }
    .topbar-link { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .topbar-icon { width: 16px; height: 16px; object-fit: contain; }
    .topbar-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.3); }
    .topbar-label { font-size: 16px; font-weight: 500; color: #fff; letter-spacing: -0.31px; white-space: nowrap; }

    /* ── MAIN ─── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    /* Oversized error code above the shared empty-state block */
    .error-code {
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      color: #007167;
      letter-spacing: -1px;
      margin-bottom: 8px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .topbar { padding: 0 20px; }
      .error-code { font-size: 52px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="dashboard.html" class="topbar-link">
      <img class="topbar-icon" src="../assets/gd-logo-white.svg" alt="">
      <div class="topbar-divider"></div>
      <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
    </a>
  </div>

  <main>
    <div class="empty-state empty-state--page" role="alert">
      <p class="error-code" aria-hidden="true">404</p>
      <div class="empty-state-icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16zM8 11h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="empty-state-title">Page not found</h1>
      <p class="empty-state-desc">The page you are looking for doesn't exist or may have been moved. Check the address, or head back to your dashboard.</p>
      <div class="empty-state-actions">
        <a href="dashboard.html" class="btn btn-primary">Back to dashboard</a>
        <a href="home.html" class="btn btn-secondary">Go to home</a>
      </div>
    </div>
  </main>
</body>
</html>
