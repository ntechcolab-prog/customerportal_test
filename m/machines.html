<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Machines — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main>
  <div id="head"></div>

  <h2 id="lbl-search">Search</h2>
  <div class="search">
    <input id="q" type="search" autocomplete="off" aria-labelledby="lbl-search"
           placeholder="Machine name or serial number…">
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by production line"></div>

  <div id="list"></div>
</main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var fleet = CP.fleet;

  /* Linhas na ordem do chão de fábrica; rótulo curto para o chip caber. */
  var LINE_ORDER = ['Line 1', 'Line 2', 'Line 3', 'Line 4', 'Black Production Only', 'White Production Only'];
  var LINE_SHORT = { 'Black Production Only': 'Black Prod.', 'White Production Only': 'White Prod.' };
  function shortLine(l) { return LINE_SHORT[l] || l; }

  var lines = [];
  fleet.forEach(function (m) { if (lines.indexOf(m.line) === -1) lines.push(m.line); });
  lines.sort(function (a, b) { return LINE_ORDER.indexOf(a) - LINE_ORDER.indexOf(b); });

  var line = 'All';
  var query = '';

  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';
  var machineIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/>' +
    '<path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M12 11v5"/></svg>';

  document.getElementById('head').innerHTML = M.ctxCard({
    from: 'Your equipment',
    title: 'Machines',
    sub: fleet.length + ' machines · ' + lines.length + ' production lines'
  });

  /* Chips: All + uma por linha. */
  var chips = document.getElementById('chips');
  chips.innerHTML = ['All'].concat(lines).map(function (l) {
    return '<button type="button" class="chip" data-line="' + M.esc(l) + '" aria-pressed="' +
      (l === line) + '">' + M.esc(l === 'All' ? 'All' : shortLine(l)) + '</button>';
  }).join('');

  function machineRow(m) {
    return '<a class="row" href="machine.html?m=' + M.esc(m.id) + '">' +
        '<span class="row-icon" aria-hidden="true">' + machineIcon + '</span>' +
        '<span class="row-body"><span class="row-title">' + M.esc(m.name) + '</span>' +
          '<span class="row-sub">' + M.esc(m.line) + ' · SN ' + M.esc(m.sn) + '</span></span>' +
        chevron +
      '</a>';
  }
  function card(items) { return '<div class="card">' + items.map(machineRow).join('') + '</div>'; }

  function matches(m) {
    if (line !== 'All' && m.line !== line) return false;
    if (query && (m.name + ' ' + m.sn + ' ' + m.type + ' ' + m.line).toLowerCase().indexOf(query) === -1) return false;
    return true;
  }

  function render() {
    var listEl = document.getElementById('list');
    var filtering = query !== '' || line !== 'All';

    if (filtering) {
      var found = fleet.filter(matches);
      listEl.innerHTML =
        '<h2>' + found.length + (found.length === 1 ? ' machine' : ' machines') + '</h2>' +
        (found.length
          ? card(found)
          : '<div class="card empty">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
              'stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/>' +
              '<path d="m20 20-4.5-4.5"/></svg>' +
              '<h3>No machines found</h3><p>Try another name or serial, or clear the filters above.</p>' +
            '</div>');
      return;
    }

    /* Sem filtro: recentes em cima, frota inteira embaixo. */
    var recent = fleet.filter(function (m) { return m.recent; });
    listEl.innerHTML =
      (recent.length ? '<h2>Recent</h2>' + card(recent) : '') +
      '<h2>All machines · ' + fleet.length + '</h2>' + card(fleet);
  }

  chips.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    line = btn.getAttribute('data-line');
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (c) {
      c.setAttribute('aria-pressed', String(c === btn));
    });
    render();
  });

  document.getElementById('q').addEventListener('input', function (e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  render();
})();
</script>
</body>
</html>
