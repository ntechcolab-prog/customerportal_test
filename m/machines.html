<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Machines — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar" data-nav="machines">
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main>
  <div class="page-head">
    <h1>Machines</h1>
    <p class="page-head-sub" id="subhead"></p>
  </div>

  <div class="search" style="margin-top:16px">
    <input id="q" type="search" autocomplete="off" aria-label="Search machines"
           placeholder="Machine name or serial number…">
  </div>

  <button type="button" class="filter-trigger" id="lineTrigger" aria-haspopup="dialog">
    <svg class="ft-funnel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
    <span class="ft-label">Line:</span>
    <span class="ft-value" id="lineValue">All</span>
    <svg class="ft-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <div id="list"></div>
</main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<div class="sheet" id="lineSheet" aria-hidden="true">
  <div class="sheet-overlay"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Filter by production line">
    <span class="sheet-grip" aria-hidden="true"></span>
    <div class="sheet-head">
      <span class="sheet-title">Filter by line</span>
      <button type="button" class="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-search" id="sheetSearchWrap" hidden>
      <input id="sheetSearch" type="search" autocomplete="off" placeholder="Find a line…" aria-label="Find a line">
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var fleet = CP.fleet;
  var $ = function (id) { return document.getElementById(id); };

  var LINE_ORDER = ['Line 1', 'Line 2', 'Line 3', 'Line 4', 'Black Production Only', 'White Production Only'];
  var LINE_SHORT = { 'Black Production Only': 'Black Prod.', 'White Production Only': 'White Prod.' };
  function shortLine(l) { return LINE_SHORT[l] || l; }

  var lines = [];
  fleet.forEach(function (m) { if (lines.indexOf(m.line) === -1) lines.push(m.line); });
  lines.sort(function (a, b) { return LINE_ORDER.indexOf(a) - LINE_ORDER.indexOf(b); });

  var line = 'All';
  var query = '';
  var sheetQuery = '';

  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';
  var machineIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/>' +
    '<path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M12 11v5"/></svg>';

  /* Foto de produto por modelo (assets do desktop). Alpha Zeta 10 não tem foto
     → cai no ícone genérico. */
  var PHOTO = {
    'Zeta 60':       'machine-zeta60.png',
    'Discus 30':     'machine-discus30.png',
    'MasterMix 45':  'machine-mastermix45.png',
    'ProPhi':        'machine-prophi.png',
    'Alpha Zeta 10': 'machine-zeta60.png'   /* sem foto própria → usa a da Zeta 60 */
  };
  function thumb(m) {
    return PHOTO[m.name]
      ? '<img class="row-thumb" src="../assets/' + PHOTO[m.name] + '" alt="" aria-hidden="true">'
      : '<span class="row-icon" aria-hidden="true">' + machineIcon + '</span>';
  }
  var checkIcon =
    '<svg class="sheet-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  $('subhead').textContent = fleet.length + ' machines · ' + lines.length + ' lines';

  function lineCount(l) {
    return l === 'All' ? fleet.length : fleet.filter(function (m) { return m.line === l; }).length;
  }

  function machineRow(m) {
    return '<a class="row" href="machine.html?m=' + M.esc(m.id) + '">' +
        thumb(m) +
        '<span class="row-body"><span class="row-title">' + M.esc(m.name) + '</span>' +
          '<span class="row-sub">' + M.esc(m.line) + ' · SN ' + M.esc(m.sn) + '</span></span>' +
        chevron +
      '</a>';
  }

  function matches(m) {
    if (line !== 'All' && m.line !== line) return false;
    if (query && (m.name + ' ' + m.sn + ' ' + m.type + ' ' + m.line).toLowerCase().indexOf(query) === -1) return false;
    return true;
  }

  function byName(a, b) { return a.name.localeCompare(b.name) || a.sn.localeCompare(b.sn); }
  function cardOf(items) { return '<div class="card">' + items.map(machineRow).join('') + '</div>'; }
  function emptyCard() {
    return '<div class="card empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
        'stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/>' +
        '<path d="m20 20-4.5-4.5"/></svg>' +
        '<h3>No machines found</h3><p>Try another name or serial, or clear the line filter.</p>' +
      '</div>';
  }

  function render() {
    /* Filtrando/buscando: lista plana ordenada. */
    if (query !== '' || line !== 'All') {
      var found = fleet.filter(matches).sort(byName);
      $('list').innerHTML = '<h2>' + found.length + (found.length === 1 ? ' machine' : ' machines') + '</h2>' +
        (found.length ? cardOf(found) : emptyCard());
      return;
    }
    /* Sem filtro: agrupado por linha (cabeçalho com contagem), na ordem do chão. */
    $('list').innerHTML = lines.map(function (l) {
      var items = fleet.filter(function (m) { return m.line === l; }).sort(byName);
      if (!items.length) return '';
      return '<div class="list-group-head"><span class="list-group-name">' + M.esc(l) + '</span>' +
        '<span class="list-group-count">' + items.length + '</span></div>' + cardOf(items);
    }).join('');
  }

  /* ── bottom sheet: seleção de linha (escala p/ dezenas de linhas) ── */
  var sheet = $('lineSheet');

  function buildSheet() {
    var opts = ['All'].concat(lines).filter(function (l) {
      if (!sheetQuery) return true;
      return (l === 'All' ? 'all lines' : l.toLowerCase()).indexOf(sheetQuery) > -1;
    });
    $('sheetList').innerHTML = opts.map(function (l) {
      return '<button type="button" class="sheet-item' + (l === line ? ' is-active' : '') +
          '" data-line="' + M.esc(l) + '">' + checkIcon +
          '<span class="sheet-item-label">' + M.esc(l === 'All' ? 'All lines' : l) + '</span>' +
          '<span class="sheet-item-count">' + lineCount(l) + '</span>' +
        '</button>';
    }).join('');
  }

  function openSheet() {
    sheetQuery = '';
    var sw = $('sheetSearch'); if (sw) sw.value = '';
    /* busca interna só quando há muitas linhas — imagina 80 delas. */
    $('sheetSearchWrap').hidden = lines.length <= 8;
    buildSheet();
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    $('lineTrigger').focus();
  }

  $('lineTrigger').addEventListener('click', openSheet);
  sheet.querySelector('.sheet-close').addEventListener('click', closeSheet);
  sheet.querySelector('.sheet-overlay').addEventListener('click', closeSheet);
  $('sheetList').addEventListener('click', function (e) {
    var btn = e.target.closest('.sheet-item');
    if (!btn) return;
    line = btn.getAttribute('data-line');
    $('lineValue').textContent = line === 'All' ? 'All' : shortLine(line);
    $('lineTrigger').classList.toggle('is-active', line !== 'All');
    closeSheet();
    render();
  });
  $('sheetSearch').addEventListener('input', function (e) {
    sheetQuery = e.target.value.trim().toLowerCase();
    buildSheet();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  $('q').addEventListener('input', function (e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  render();
})();
</script>
</body>
</html>
