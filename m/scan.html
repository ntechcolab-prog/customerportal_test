<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Scan — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Customer Portal</span>
  </span>
  <span class="topbar-tag">Phone</span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  /* Alvo de handoff: se o link do QR já expirou, não há o que capturar. */
  if (M.isExpired()) { app.innerHTML = M.expiredMarkup; return; }

  var method = M.param('method', 'photo');
  var result = M.param('result', null);

  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';

  var ICON = {
    photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 7h3l1.7-2h6.6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>',
    code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>' +
      '<path d="M8 8v8M11 8v8M14 8v8M16.5 8v8"/></svg>',
    nameplate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h10M7 14h6"/></svg>',
    beads: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M3 8l9-4 9 4v8l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v8"/></svg>',
    machine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M12 11v5"/></svg>',
    rescan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 4v5h-5"/></svg>',
    parts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.6M12 18.4V21M21 12h-2.6M5.6 12H3M18.4 5.6l-1.9 1.9M7.5 16.5l-1.9 1.9M18.4 18.4l-1.9-1.9M7.5 7.5 5.6 5.6"/></svg>'
  };

  /* Peças: foto e código convergem no mesmo resultado que o "Description" já produz. */
  var partsCtx = CP.parts['search-zeta60'];
  var partsMachine = CP.machines[partsCtx.machine].name;
  /* Reorder: o produto do último pedido (order-detail). */
  var beads = CP.order.item;

  function header(sub) { return M.ctxCard({ from: conf.from, title: conf.title, sub: sub }); }
  function go(r) { window.location.search = '?method=' + method + '&result=' + r; }

  function machineRow(id) {
    var mm = CP.machines[id];
    return '<a class="row" href="machine.html?m=' + id + '">' +
        '<span class="row-icon" aria-hidden="true">' + ICON.machine + '</span>' +
        '<span class="row-body"><span class="row-title">' + M.esc(mm.name) + '</span>' +
          '<span class="row-sub">' + M.esc(mm.line) + ' · SN ' + M.esc(mm.sn) + '</span></span>' + chevron +
      '</a>';
  }

  /* "Scan again" + (só para busca de peça) troca de método. */
  function again() {
    var switchRow = '';
    if (conf.sibling) {
      var s = METHODS[conf.sibling];
      switchRow =
        '<a class="row" href="scan.html?method=' + conf.sibling + '">' +
          '<span class="row-icon" aria-hidden="true">' + ICON[conf.sibling] + '</span>' +
          '<span class="row-body"><span class="row-title">' + M.esc(s.switchLabel) + '</span>' +
            '<span class="row-sub">Same search, other method</span></span>' + chevron +
        '</a>';
    }
    return '<h2>Not it?</h2><div class="card">' +
        '<a class="row" href="scan.html?method=' + method + '">' +
          '<span class="row-icon" aria-hidden="true">' + ICON.rescan + '</span>' +
          '<span class="row-body"><span class="row-title">' + M.esc(conf.cta) + ' again</span>' +
            '<span class="row-sub">Line it up and try once more</span></span>' + chevron +
        '</a>' + switchRow +
      '</div>';
  }

  function emptyState(title, body) {
    return '<div class="card empty lead">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
        'stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/>' +
        '<path d="m20 20-4.5-4.5"/><path d="M8 10.5h5"/></svg>' +
        '<h3>' + title + '</h3><p>' + body + '</p>' +
      '</div>';
  }

  /* ── resultado: busca de peça (photo / code) ── */
  function partResults(r) {
    var found = method === 'code' ? 'that code' : 'your photo';
    var link = '<div class="card"><a class="row" href="parts.html?ctx=search-zeta60">' +
        '<span class="row-icon" aria-hidden="true">' + ICON.parts + '</span>' +
        '<span class="row-body"><span class="row-title">Open in Milla results</span>' +
          '<span class="row-sub">Full spare-parts list for ' + M.esc(partsMachine) + '</span></span>' + chevron +
      '</a></div>';
    if (r === 'match') {
      return { sub: partsMachine + ' · exact match',
        body: '<div class="callout lead"><strong>Exact match.</strong> One part in the ' +
          M.esc(partsMachine) + ' catalogue matches ' + found + '.</div>' +
          '<h2>Matched part</h2><div class="stack">' + M.partsList([partsCtx.items[0]]) + link + '</div>' + again() };
    }
    if (r === 'none') {
      return { sub: partsMachine + ' · no match',
        body: emptyState('No match from ' + found,
          'Nothing in the ' + M.esc(partsMachine) + ' catalogue lined up. Try again, switch method, ' +
          'or describe it to Milla back at the desk.') + again() };
    }
    return { sub: partsMachine + ' · ' + partsCtx.items.length + ' candidates',
      body: '<div class="callout lead"><strong>' + partsCtx.items.length +
        ' possible matches.</strong> Milla couldn&rsquo;t pick one for sure from ' + found +
        ' — tap the right part to open it.</div>' +
        '<h2>Candidates</h2><div class="stack">' + M.partsList(partsCtx.items) + link + '</div>' + again() };
  }

  /* ── resultado: identificar máquina (nameplate) ── */
  function machineResults(r) {
    if (r === 'candidates') {
      return { sub: '2 machines match',
        body: '<div class="callout lead"><strong>Two machines match.</strong> Pick the one in ' +
          'front of you.</div><h2>Which one?</h2><div class="card">' +
          machineRow('zeta60') + machineRow('discus30') + '</div>' + again() };
    }
    if (r === 'unknown') {
      return { sub: 'not recognized',
        body: emptyState('Nameplate not recognized',
          'The read didn&rsquo;t match a machine on your account. Clean the plate, improve the ' +
          'light and try again, or type the serial number.') + again() };
    }
    if (r === 'noaccess') {
      return { sub: 'no access',
        body: '<div class="callout is-warn lead"><strong>This machine isn&rsquo;t on your account.</strong> ' +
          'The nameplate reads an <strong>Alpha Zeta 10</strong> registered to another account. Ask an ' +
          'admin to grant you access before it shows up here.</div>' + again() };
    }
    return { sub: 'Zeta 60 · identified',
      body: '<div class="callout lead"><strong>Machine identified.</strong> The nameplate reads a ' +
        'Zeta 60 on your account.</div><h2>Machine</h2><div class="card">' + machineRow('zeta60') + '</div>' + again() };
  }

  /* ── resultado: reorder por scan (beads) ── */
  function reorderResults(r) {
    if (r === 'added') {
      return { sub: 'added to cart',
        body: '<div class="callout lead" style="background:var(--ok-wash);border-color:#cfe6d8;color:var(--ok-ink)">' +
          '<strong>Added to cart.</strong> 1 kg of ' + M.esc(beads.name) + ' (' + M.esc(beads.unit) +
          ') is in your cart — finish the order at your desk.</div>' +
          '<h2>Scan another</h2><div class="card">' +
            '<a class="row" href="scan.html?method=beads">' +
              '<span class="row-icon" aria-hidden="true">' + ICON.beads + '</span>' +
              '<span class="row-body"><span class="row-title">Scan another pack</span>' +
                '<span class="row-sub">Keep reordering from the shelf</span></span>' + chevron +
            '</a></div>' };
    }
    if (r === 'ambiguous') {
      return { sub: '2 products match',
        body: '<div class="callout lead"><strong>Two products match that code.</strong> Pick the one ' +
          'on the pack.</div><h2>Which one?</h2><div class="card">' +
          '<a class="row" href="scan.html?method=beads&result=identified">' +
            '<span class="row-icon" aria-hidden="true">' + ICON.beads + '</span>' +
            '<span class="row-body"><span class="row-title">' + M.esc(beads.name) + '</span>' +
              '<span class="row-sub">Ref ' + M.esc(beads.ref) + ' · ' + M.esc(beads.unit) + '/kg</span></span>' + chevron +
          '</a>' +
          '<a class="row" href="scan.html?method=beads&result=identified">' +
            '<span class="row-icon" aria-hidden="true">' + ICON.beads + '</span>' +
            '<span class="row-body"><span class="row-title">ZetaBeads Plus 0.3mm</span>' +
              '<span class="row-sub">Ref 140028 · 42,10 €/kg</span></span>' + chevron +
          '</a></div>' + again() };
    }
    if (r === 'notorderable') {
      return { sub: 'not orderable',
        body: '<div class="callout is-warn lead"><strong>You can&rsquo;t order this item.</strong> ' +
          'Only Buyers and Admins can reorder consumables — send this pack to your Buyer, or ask for ' +
          'the role.</div>' + again() };
    }
    /* identified — o caminho feliz: quantidade do último pedido num toque. */
    return { sub: beads.name + ' · identified',
      body: '<div class="callout lead"><strong>Product identified.</strong> Read from the packaging — ' +
        'reorder the last quantity in one tap.</div>' +
        '<h2>Reorder</h2>' +
        '<div class="card"><div class="row">' +
          '<span class="row-icon" aria-hidden="true">' + ICON.beads + '</span>' +
          '<span class="row-body"><span class="row-title">' + M.esc(beads.name) + '</span>' +
            '<span class="row-sub">Ref ' + M.esc(beads.ref) + ' · ' + M.esc(beads.size) + '</span></span>' +
        '</div></div>' +
        M.specs([['Last order', beads.qty], ['Unit price', beads.unit + ' / kg']]) +
        '<button type="button" class="btn btn-primary btn-full" id="reorder" style="margin-top:14px">' +
          'Reorder 1 kg</button>' +
        again() };
  }

  /* ── registry de métodos ── */
  var METHODS = {
    photo: {
      from: 'Handed off from Milla', title: 'Search by photo', captureSub: partsMachine + ' · Milla search',
      hint: 'Point your phone at the part. Milla matches it against the ' + partsMachine + ' catalogue.',
      cta: 'Capture photo', icon: 'photo', scanLine: false, manual: null,
      sibling: 'code', switchLabel: 'Try the product code instead', go: 'candidates', results: partResults
    },
    code: {
      from: 'Handed off from Milla', title: 'Search by product code', captureSub: partsMachine + ' · Milla search',
      hint: 'Point your phone at the code on the part or its plate.',
      cta: 'Scan code', icon: 'code', scanLine: true,
      manual: { placeholder: 'Type the material number', inputmode: 'numeric' },
      sibling: 'photo', switchLabel: 'Try a photo instead', go: 'candidates', results: partResults
    },
    nameplate: {
      from: 'At the machine', title: 'Identify this machine', captureSub: 'Point at the nameplate',
      hint: 'Point your phone at the machine nameplate. No serial number to type.',
      cta: 'Scan nameplate', icon: 'nameplate', scanLine: true,
      manual: { placeholder: 'Type the serial number', inputmode: 'text' },
      sibling: null, go: 'match', results: machineResults
    },
    beads: {
      from: 'In the warehouse', title: 'Reorder by scanning', captureSub: 'Point at the beads packaging',
      hint: 'Point your phone at the code on the beads packaging.',
      cta: 'Scan packaging', icon: 'beads', scanLine: true,
      manual: { placeholder: 'Type the product code', inputmode: 'numeric' },
      sibling: null, go: 'identified', results: reorderResults
    }
  };
  var conf = METHODS[method] || METHODS.photo;

  /* ── estado de captura (compartilhado) ── */
  function renderCapture() {
    app.innerHTML =
      header(conf.captureSub) +
      '<div class="scan-capture">' +
        '<div class="scan-frame">' +
          '<div class="scan-reticle' + (conf.scanLine ? ' is-code' : '') + '" aria-hidden="true"></div>' +
          '<div class="scan-ico" aria-hidden="true">' + ICON[conf.icon] + '</div>' +
          '<p class="scan-hint">' + M.esc(conf.hint) + '</p>' +
        '</div>' +
        '<button type="button" class="btn btn-primary btn-full" id="capture">' + M.esc(conf.cta) + '</button>' +
      '</div>' +
      (conf.manual
        ? '<h2>Or enter it by hand</h2><div class="card"><div class="row">' +
            '<input class="scan-input" id="manual" inputmode="' + conf.manual.inputmode + '" ' +
              'placeholder="' + M.esc(conf.manual.placeholder) + '" aria-label="' + M.esc(conf.manual.placeholder) + '">' +
            '<button type="button" class="btn" id="lookup">Look up</button>' +
          '</div></div>'
        : '');

    document.getElementById('capture').addEventListener('click', function () { go(conf.go); });
    var lookup = document.getElementById('lookup');
    if (lookup) lookup.addEventListener('click', function () { go(conf.go); });
  }

  function renderResult() {
    var out = conf.results(result);
    app.innerHTML = header(out.sub) + out.body;
    var reorder = document.getElementById('reorder');
    if (reorder) reorder.addEventListener('click', function () { go('added'); });
  }

  if (result) { renderResult(); } else { renderCapture(); }
})();
</script>
</body>
</html>
