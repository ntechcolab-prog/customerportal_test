<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Service request — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="services.html" aria-label="Back to service requests">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* Detalhe do Service Request. Resolve por ?id (SR-2):
   • SR-1192 = o chamado RICO (CP.service): timeline por status, callout do
     último evento, anexar foto, tratamento de notificação "stale" (CP-671).
   • Demais ids = detalhe LEVE a partir de CP.services (histórico do portal) ou
     de um chamado que você abriu agora no celular (sessionStorage cp_submitted).
   Mesmo princípio do machine.html: poucos ricos, o resto na mesma estrutura com
   os dados que existem. */
(function () {
  'use strict';
  var app = document.getElementById('app');
  var esc = M.esc;

  var LABELS = { submitted: 'Submitted', 'in-progress': 'In Progress', completed: 'Completed', cancelled: 'Cancelled' };
  var BADGE_CLS = { submitted: 'is-submitted', 'in-progress': 'is-progress', completed: 'is-completed', cancelled: 'is-cancelled' };
  var ORDER = ['submitted', 'in-progress', 'completed'];

  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';
  var machineIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/>' +
    '<path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M12 11v5"/></svg>';

  function resolveMachine(id) {
    if (CP.machines[id]) return CP.machines[id];
    if (CP.fleet) { for (var i = 0; i < CP.fleet.length; i++) { if (CP.fleet[i].id === id) return CP.fleet[i]; } }
    return CP.machines.zeta60;
  }
  function serviceBy(m) {
    if (m.info) { for (var i = 0; i < m.info.length; i++) { if (m.info[i][0] === 'Service by') return m.info[i][1]; } }
    return 'NEM';
  }
  function machineLinkCard(m) {
    return '<h2>Machine</h2>' +
      '<div class="card"><a class="row" href="machine.html?m=' + esc(m.id) + '">' +
        '<span class="row-icon" aria-hidden="true">' + machineIcon + '</span>' +
        '<span class="row-body"><span class="row-title">' + esc(m.name) + '</span>' +
          '<span class="row-sub">' + esc(m.line) + ' · SN ' + esc(m.sn) + '</span></span>' +
        chevron +
      '</a></div>';
  }
  function referenceCard(id) {
    return '<h2>Reference</h2>' +
      '<div class="card"><div class="row">' +
        '<span class="row-body"><span class="row-title" style="font-variant-numeric:tabular-nums">' +
          esc(id) + '</span><span class="row-sub">Quote this when you contact NETZSCH</span></span>' +
        '<button type="button" class="btn copy" data-copy="' + esc(id) + '" ' +
          'aria-label="Copy request number">Copy</button>' +
      '</div></div>';
  }

  var id = M.param('id', 'SR-1192');

  /* Chamado aberto agora no celular (SR-1)? */
  var submitted = null;
  try {
    (JSON.parse(sessionStorage.getItem('cp_submitted') || '[]') || []).forEach(function (s) {
      if (s.id === id) submitted = s;
    });
  } catch (e) {}

  /* ── Caminho 1: SR-1192, o chamado rico ── */
  if (id === CP.service.id && !submitted) { renderRich(); return; }

  /* ── Caminho 2: detalhe leve (histórico do portal ou recém-criado) ── */
  var s = submitted;
  if (!s) {
    (CP.services || []).forEach(function (x) { if (x.id === id) s = x; });
  }
  if (!s) { renderRich(); return; }   /* id desconhecido → cai no chamado principal */
  renderLight(s);

  /* ═══════════════ detalhe leve ═══════════════ */
  function renderLight(s) {
    var m = resolveMachine(s.machine);
    var label = LABELS[s.status] || s.status;
    document.title = 'Service ' + s.id + ' — NETZSCH Customer Portal';

    var lead = submitted
      ? '<div class="callout is-ok" style="margin-top:14px"><strong>Request submitted.</strong> ' +
          'NETZSCH will confirm and assign a technician.</div>'
      : (s.desc ? '<div class="callout" style="margin-top:14px">' + esc(s.desc) + '</div>' : '');

    var specs = [
      ['Request ID', s.id],
      ['Type', s.type],
      ['Status', label],
      ['Machine', m.name],
      ['Serial number', m.sn],
      ['Date', s.date]
    ];
    if (s.title) specs.splice(1, 0, ['Title', s.title]);

    app.innerHTML =
      M.ctxCard({ title: 'Service #' + s.id, sub: s.type + ' · ' + m.name, badge: M.badge(label, BADGE_CLS[s.status]) }) +
      lead +
      '<h2>Request</h2>' + M.specs(specs) +
      machineLinkCard(m) +
      referenceCard(s.id);
  }

  /* ═══════════════ detalhe rico (SR-1192) ═══════════════ */
  function renderRich() {
    var sv = CP.service;
    var m = CP.machines[sv.machine];

    var since = M.param('since', sv.status);
    var stale = ORDER.indexOf(since) > -1 && ORDER.indexOf(since) < ORDER.indexOf(sv.status);
    var currentLabel = LABELS[sv.status] || sv.status;

    document.title = 'Service ' + sv.id + ' — NETZSCH Customer Portal';

    var steps = sv.steps.map(function (st) {
      return '<li class="track-step' + (st.done ? ' is-done' : '') + '">' +
          '<span class="track-mark" aria-hidden="true"><span class="track-dot"></span><span class="track-line"></span></span>' +
          '<span class="track-body">' +
            '<span class="track-title">' + esc(st.title) + '</span>' +
            '<span class="track-note">' + esc(st.note) + '</span>' +
            '<span class="track-state">' + esc(st.state) + '</span>' +
          '</span>' +
        '</li>';
    }).join('');

    var lead = stale
      ? '<div class="callout is-warn" style="margin-top:14px">' +
          '<strong>This request moved on since that alert.</strong> The notification you tapped said ' +
          '&ldquo;' + esc(LABELS[since] || since) + '&rdquo;. It&rsquo;s now <strong>' + esc(currentLabel) +
          '</strong> — you&rsquo;re looking at where it stands right now, not where the alert left it.' +
        '</div>'
      : '<div class="callout" style="margin-top:14px">' +
          '<strong>' + esc(sv.event.title) + '.</strong> ' + esc(sv.event.note) +
          ' <span style="color:var(--ink-3)">' + esc(sv.event.time) + '</span>' +
        '</div>';

    app.innerHTML =
      M.ctxCard({
        from: 'Opened from a notification',
        title: 'Service ' + sv.id,
        sub: sv.type + ' · ' + m.name,
        badge: M.badge(currentLabel, BADGE_CLS[sv.status])
      }) +
      lead +
      '<h2>Progress</h2>' +
      '<div class="card"><ol class="track" style="list-style:none">' + steps + '</ol></div>' +
      '<h2>Report</h2>' +
      '<div class="card"><a class="row" href="capture.html?target=service">' +
        '<span class="row-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M4 7h3l1.7-2h6.6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>' +
        '</span>' +
        '<span class="row-body"><span class="row-title">Add a photo of the problem</span>' +
          '<span class="row-sub">Snap the fault — Service sees it without a call</span></span>' +
        chevron +
      '</a></div>' +
      '<h2>Request</h2>' +
      M.specs([
        ['Request ID', sv.id],
        ['Type', sv.type],
        ['Machine', m.name],
        ['Serial number', m.sn],
        ['Scheduled', sv.scheduled],
        ['Service by', sv.serviceBy]
      ]) +
      machineLinkCard(m) +
      referenceCard(sv.id);
  }
})();
</script>
</body>
</html>
