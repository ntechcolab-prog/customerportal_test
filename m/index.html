<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Customer Portal — on your phone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar" data-nav="home">
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main>
  <!-- Máquinas em evidência: o companion parte sempre da máquina. Renderizado
       a partir de CP.fleet (as com `status`), ordenado por severidade. -->
  <section id="machines-hero" aria-label="Your machines"></section>

  <h2>Scan &amp; find</h2>
  <div class="card">
    <a class="row" href="scan.html?method=nameplate">
      <span class="row-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h10M7 14h6"/>
        </svg>
      </span>
      <span class="row-body">
        <span class="row-title">Scan a machine</span>
        <span class="row-sub">Identify the one in front of you</span>
      </span>
      <svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>
    </a>
    <a class="row" href="scan.html?method=photo">
      <span class="row-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/>
        </svg>
      </span>
      <span class="row-body">
        <span class="row-title">Find a spare part</span>
        <span class="row-sub">By photo or product code</span>
      </span>
      <svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>
    </a>
    <a class="row" href="reorder.html">
      <span class="row-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8l9-4 9 4v8l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v8"/>
        </svg>
      </span>
      <span class="row-body">
        <span class="row-title">Reorder beads</span>
        <span class="row-sub">From your recent orders</span>
      </span>
      <svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>
    </a>
  </div>

</main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var host = document.getElementById('machines-hero');
  if (!host || !window.CP || !window.M) return;
  var esc = M.esc;
  var PHOTO = {
    'Zeta 60': 'machine-zeta60.png', 'Discus 30': 'machine-discus30.png',
    'MasterMix 45': 'machine-mastermix45.png', 'ProPhi': 'machine-prophi.png',
    'Alpha Zeta 10': 'machine-zeta60.png'
  };
  var SEV = { attention: 0, running: 1, idle: 2 };
  var LABEL = { attention: 'Attention', running: 'Running', idle: 'Idle' };
  var chevron = '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';

  var featured = CP.fleet.filter(function (m) { return m.status; })
    .sort(function (a, b) { return (SEV[a.status] == null ? 9 : SEV[a.status]) - (SEV[b.status] == null ? 9 : SEV[b.status]); });

  var cards = featured.map(function (m) {
    return '<a class="row mrow card" href="machine.html?m=' + esc(m.id) + '">' +
        '<img class="row-thumb" src="../assets/' + (PHOTO[m.name] || 'machine-zeta60.png') + '" alt="" aria-hidden="true">' +
        '<span class="row-body"><span class="row-title">' + esc(m.name) + '</span>' +
          '<span class="row-sub">' + esc(m.line || '—') + '</span></span>' +
        '<span class="mrow-end"><span class="mstatus ' + m.status + '">' + LABEL[m.status] + '</span>' + chevron + '</span>' +
      '</a>';
  }).join('');

  host.innerHTML =
    '<div class="sec-head"><h2>Your machines</h2>' +
      '<a class="sec-link" href="machines.html">All ' + CP.fleet.length + ' <span aria-hidden="true">›</span></a></div>' +
    '<div class="mlist">' + cards + '</div>';
})();
</script>
</body>
</html>
