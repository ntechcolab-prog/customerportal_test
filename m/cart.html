<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Cart — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  app.addEventListener('click', onClick);
  render();

  /* Cart: peças montadas na máquina/scan/reorder, prontas para comprar aqui
     mesmo (sem passar pelo desktop). Quantidade editável; subtotal com os itens
     com preço; itens "Quotation only" viram cotação no checkout. */
  function render() {
    var items = M.cart.items();
    if (!items.length) { renderEmpty(); return; }

    var priced = items.filter(function (p) { return M.money.isPriced(p.price); });
    var subtotal = priced.reduce(function (s, p) { return s + M.money.parse(p.price) * (p.qty || 1); }, 0);
    var quoteCount = items.length - priced.length;
    var hasPriced = priced.length > 0;

    app.innerHTML =
      '<div class="page-head"><h1>Cart</h1>' +
        '<p class="page-head-sub">' + items.length + (items.length === 1 ? ' item' : ' items') + '</p></div>' +
      '<div class="card">' + items.map(function (p) {
        var qty = p.qty || 1;
        var isQuote = !M.money.isPriced(p.price);
        var line = isQuote ? 'Quotation only' : M.money.format(M.money.parse(p.price) * qty);
        return '<div class="part is-stacked">' +
            '<div class="part-top">' +
              '<div class="part-body"><div class="part-name">' + M.esc(p.name) + '</div>' +
                '<div class="part-meta">' + M.esc(p.code) + '</div></div>' +
              '<span class="part-price' + (isQuote ? ' quote' : '') + '">' + M.esc(line) + '</span>' +
            '</div>' +
            '<div class="part-actions">' +
              '<span class="qstep">' +
                '<button type="button" class="qstep-btn cart-step" data-step="-" data-code="' + M.esc(p.code) + '" aria-label="Decrease quantity">−</button>' +
                '<span class="qstep-val"><b class="cart-qty" data-code="' + M.esc(p.code) + '">' + qty + '</b></span>' +
                '<button type="button" class="qstep-btn cart-step" data-step="+" data-code="' + M.esc(p.code) + '" aria-label="Increase quantity">+</button>' +
              '</span>' +
              '<button type="button" class="btn btn-secondary cart-remove" data-remove="' + M.esc(p.code) + '" aria-label="Remove ' + M.esc(p.name) + '">Remove</button>' +
            '</div>' +
          '</div>';
      }).join('') + '</div>' +

      (quoteCount
        ? '<div class="card"><div class="sum-note" style="margin-top:0">' + quoteCount + (quoteCount === 1 ? ' item is priced on quotation' : ' items are priced on quotation') + ' — NETZSCH confirms pricing at checkout.</div></div>'
        : '') +

      '<div class="actionbar">' +
        (hasPriced ? '<div class="actionbar-total"><span>Subtotal</span><b>' + M.money.format(subtotal) + '</b></div>' : '') +
        '<a class="btn btn-primary' + (hasPriced ? '' : ' btn-full') + '" id="checkout" href="checkout.html">' +
          (hasPriced ? 'Checkout' : 'Request quote') +
        '</a>' +
      '</div>' +
      '<div class="actionbar-spacer"></div>';
  }

  function onClick(e) {
    var step = e.target.closest('.cart-step');
    if (step) {
      var code = step.getAttribute('data-code');
      var it = M.cart.items().filter(function (x) { return x.code === code; })[0];
      if (!it) return;
      it.qty = Math.max(1, Math.min(99, (it.qty || 1) + (step.getAttribute('data-step') === '+' ? 1 : -1)));
      M.cart.add(it);
      render();
      return;
    }
    var rem = e.target.closest('.cart-remove');
    if (rem) { M.cart.remove(rem.getAttribute('data-remove')); render(); return; }
  }

  function renderEmpty() {
    app.innerHTML =
      '<div class="page-head"><h1>Cart</h1></div>' +
      '<div class="card empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.2 11.2a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L20 8H6.2"/></svg>' +
        '<h3>Your cart is empty</h3>' +
        '<p>Add spare parts from a machine or a search, then check out right here on your phone.</p>' +
      '</div>' +
      '<div class="cap-actions"><a class="btn btn-full" href="index.html">Back to home</a></div>';
  }
})();
</script>
</body>
</html>
