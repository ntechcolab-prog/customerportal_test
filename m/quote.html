<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Accept quote — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Customer Portal</span>
  </span>
  <span class="topbar-tag">Phone</span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var esc = M.esc;
  var Q = CP.quote;

  /* Deep link (CP-659): ?state= reflete a situação da quote no momento do aviso.
     pending → decidir · expired → validade venceu · accepted → já aceita. */
  var state = M.param('state', Q.status);

  var checkSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
  var xSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

  function head(badgeLabel, badgeCls) {
    return M.ctxCard({
      from: 'From notification #' + Q.ref,
      title: 'Quotation #' + Q.id,
      sub: Q.summary,
      badge: M.badge(badgeLabel, badgeCls),
      role: Q.role
    });
  }

  /* Itens de linha — o que a pessoa precisa ver antes de assumir o compromisso. */
  function itemsCard() {
    return '<div class="card">' + Q.items.map(function (it) {
      return '<div class="part">' +
          '<div class="part-pos">×' + esc(it.qty) + '</div>' +
          '<div class="part-body">' +
            '<div class="part-name">' + esc(it.name) + '</div>' +
            '<div class="part-code">Ref ' + esc(it.ref) + ' · ' + esc(it.unit) + ' each</div>' +
          '</div>' +
          '<div class="part-right"><span class="part-price">' + esc(it.line) + '</span></div>' +
        '</div>';
    }).join('') + '</div>';
  }

  function summarySpecs() {
    return M.specs([
      ['Items', Q.count],
      ['Total', Q.total],
      ['Delivery', Q.delivery],
      ['Ship to', Q.shipTo]
    ]);
  }

  function result(cls, ico, title, body) {
    return '<div class="card"><div class="result" role="status">' +
        '<span class="result-ico ' + cls + '" aria-hidden="true">' + ico + '</span>' +
        '<h3>' + esc(title) + '</h3>' +
        '<p>' + body + '</p>' +
      '</div></div>';
  }

  /* ── Estados de exceção ── */

  // Link expirado (o link do handoff, não a quote).
  if (M.isExpired()) { app.innerHTML = M.expiredMarkup; return; }

  // Quote expirada.
  if (state === 'expired') {
    app.innerHTML =
      head('Expired', 'is-cancelled') +
      '<div class="callout is-warn lead">' +
        '<strong>This quotation has expired.</strong> Its ' + Q.validityDays +
        '-day window has passed. Request a new one from your computer if you still need it.' +
      '</div>' +
      '<h2>What was quoted</h2>' + itemsCard() + summarySpecs();
    return;
  }

  // Quote já aceita.
  if (state === 'accepted') {
    app.innerHTML =
      head('Accepted', 'is-completed') +
      '<div class="callout lead">' +
        '<strong>This quotation was already accepted.</strong> ' +
        'It’s being converted into an order — nothing left to do here.' +
      '</div>' +
      summarySpecs();
    return;
  }

  /* ── Fluxo normal: decidir ── */
  function render(view, reasonText) {
    var body, badge;

    if (view === 'done-accept') {
      badge = ['Accepted', 'is-completed'];
      body = result('is-ok', checkSvg, 'Quotation accepted',
        'Quotation #' + esc(Q.id) + ' is accepted and will be converted into an order. NETZSCH will proceed.');

    } else if (view === 'done-decline') {
      badge = ['Declined', 'is-cancelled'];
      body = result('is-no', xSvg, 'Quotation declined',
        'Quotation #' + esc(Q.id) + ' was declined.') +
        (reasonText
          ? '<div class="callout is-warn"><strong>Note sent:</strong> ' + esc(reasonText) + '</div>'
          : '');

    } else if (view === 'commit') {
      badge = ['Pending approval', 'is-progress'];
      body =
        '<div class="callout is-warn lead">' +
          '<strong>Accepting is a commercial commitment.</strong> ' +
          'This converts Quotation #' + esc(Q.id) + ' (' + esc(Q.total) + ') into an order at NETZSCH.' +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn btn-primary btn-full" id="confirmAccept">Confirm acceptance</button>' +
          '<button type="button" class="btn btn-full" id="cancelAccept">Cancel</button>' +
        '</div>';

    } else if (view === 'decline') {
      badge = ['Pending approval', 'is-progress'];
      body =
        '<h2>Decline quotation</h2>' +
        '<div class="field">' +
          '<label class="field-label" for="declineText">Reason (optional)</label>' +
          '<textarea class="field-input" id="declineText" ' +
            'placeholder="Add a note for NETZSCH (optional)"></textarea>' +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn btn-danger btn-full" id="confirmDecline">Confirm decline</button>' +
          '<button type="button" class="btn btn-full" id="cancelDecline">Cancel</button>' +
        '</div>';

    } else { /* decide */
      badge = ['Pending approval', 'is-progress'];
      body =
        '<div class="callout lead">Valid for <strong>' + Q.validityDays +
          ' days</strong> from receipt. After that it expires automatically.</div>' +
        '<h2>What you’re accepting</h2>' +
        itemsCard() +
        summarySpecs() +
        '<div class="actions">' +
          '<button type="button" class="btn btn-primary btn-full" id="accept">Accept quotation</button>' +
          '<button type="button" class="btn btn-danger btn-full" id="decline">Decline…</button>' +
        '</div>' +
        '<p class="note">Need changes? Request a revision from your computer — the phone only accepts or declines.</p>';
    }

    app.innerHTML = head(badge[0], badge[1]) + body;
    wire(view);
  }

  function wire(view) {
    if (view === 'decide') {
      document.getElementById('accept').addEventListener('click', function () {
        render('commit');
        window.scrollTo(0, 0);
      });
      document.getElementById('decline').addEventListener('click', function () {
        render('decline');
        var ta = document.getElementById('declineText');
        if (ta) ta.focus();
      });
      return;
    }

    if (view === 'commit') {
      document.getElementById('confirmAccept').addEventListener('click', function () {
        render('done-accept');
        window.scrollTo(0, 0);
      });
      document.getElementById('cancelAccept').addEventListener('click', function () {
        render('decide');
      });
      return;
    }

    if (view === 'decline') {
      document.getElementById('confirmDecline').addEventListener('click', function () {
        var reason = document.getElementById('declineText').value.trim();
        render('done-decline', reason);
        window.scrollTo(0, 0);
      });
      document.getElementById('cancelDecline').addEventListener('click', function () {
        render('decide');
      });
    }
  }

  render('decide');
})();
</script>
</body>
</html>
