<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>New service request — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" id="back" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<!-- Bottom sheet: trocar a máquina (a versão celular do <select> do desktop,
     com busca porque a frota escala). Padrão copiado de machines.html. -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-overlay"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Choose machine">
    <span class="sheet-grip" aria-hidden="true"></span>
    <div class="sheet-head">
      <span class="sheet-title">Choose machine</span>
      <button type="button" class="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-search" id="sheetSearchWrap" hidden>
      <input id="sheetSearch" type="search" autocomplete="off" placeholder="Find a machine…" aria-label="Find a machine">
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* SR-1 · Novo Service Request. Espelha o form do desktop
   (pages/service-request.html): tipo em radio cards (Repair / Maintenance /
   Spare Parts Request / Consultation, cada um com subtítulo), Title, Problem
   Description e Attachments — só que numa coluna, com a máquina pré-preenchida
   pela câmera/QR e a foto do problema no lugar do dropzone.

   Fidelidade: tipos, labels e o modelo (Submitted → In Progress → Completed)
   saem do portal. O número novo (SR-1193) continua a sequência do único chamado
   real do protótipo (SR-1192), como os Orders estendem a numeração.

   Rascunho persistido em sessionStorage (mesmo padrão do cart em app.js):
   machine/type/title/description/photos sobrevivem ao round-trip da câmera. */
(function () {
  'use strict';
  var app = document.getElementById('app');
  var esc = M.esc;

  if (M.isExpired()) { app.innerHTML = M.expiredMarkup; return; }

  var DRAFT_KEY = 'cp_newsr';
  var NEW_ID = 'SR-1193';                    /* próximo nº na sequência de SR-1192 */
  var REQ = ' <span aria-hidden="true" style="color:#9a1c1c">*</span>';

  /* Tipos e subtítulos idênticos aos radio cards do desktop. */
  var TYPES = [
    { value: 'Repair',              sub: 'Equipment fix' },
    { value: 'Maintenance',         sub: 'Preventive care' },
    { value: 'Spare Parts Request', sub: 'Request parts' },
    { value: 'Consultation',        sub: 'Expert advice' }
  ];

  /* Foto de produto por modelo (assets do desktop) — mesma tabela de machines.html. */
  var PHOTO = {
    'Zeta 60':       'machine-zeta60.png',
    'Discus 30':     'machine-discus30.png',
    'MasterMix 45':  'machine-mastermix45.png',
    'ProPhi':        'machine-prophi.png',
    'Alpha Zeta 10': 'machine-zeta60.png'
  };

  /* ── ícones ── */
  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';
  var caretSvg =
    '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;color:var(--ink-2)"><path d="M6 9l6 6 6-6"/></svg>';
  var camSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M4 7h3l1.7-2h6.6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>';
  var machineIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/>' +
    '<path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M12 11v5"/></svg>';
  var checkIcon =
    '<svg class="sheet-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
  var sendSvg =
    '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10m0 0l-4-4m4 4l-4 4"/></svg>';
  var okSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  /* Resolve qualquer id (máquina rica de CP.machines OU unidade da frota) para
     um objeto com name/line/sn. A frota tem ids como "zeta60-2" fora de CP.machines. */
  function resolveMachine(id) {
    if (CP.machines[id]) return CP.machines[id];
    if (CP.fleet) {
      for (var i = 0; i < CP.fleet.length; i++) {
        if (CP.fleet[i].id === id) return CP.fleet[i];
      }
    }
    return CP.machines.zeta60;
  }
  function thumb(m) {
    return PHOTO[m.name]
      ? '<img class="row-thumb" src="../assets/' + PHOTO[m.name] + '" alt="" aria-hidden="true">'
      : '<span class="row-icon" aria-hidden="true">' + machineIcon + '</span>';
  }

  /* ── rascunho ── */
  function loadDraft() { try { return JSON.parse(sessionStorage.getItem(DRAFT_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function saveDraft() { try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (e) {} }
  function clearDraft() { try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  var draft = loadDraft();
  /* ?m= manda na primeira carga; depois o rascunho é a fonte da verdade (para a
     máquina sobreviver ao round-trip da câmera). */
  var mParam = M.param('m', null);
  if (mParam) draft.machine = mParam;
  if (!draft.machine) draft.machine = 'zeta60';
  if (typeof draft.photos !== 'number') draft.photos = 0;
  saveDraft();

  var back = document.getElementById('back');
  if (back && mParam) back.setAttribute('href', 'machine.html?m=' + encodeURIComponent(draft.machine));

  /* ── blocos do formulário ── */
  function machineBlock() {
    var m = resolveMachine(draft.machine);
    return '<h2>Machine</h2>' +
      '<div class="card"><button type="button" class="row" id="machineTrigger" ' +
        'aria-haspopup="dialog" style="width:100%;text-align:left;background:none;border:0;font:inherit;cursor:pointer">' +
        thumb(m) +
        '<span class="row-body"><span class="row-title">' + esc(m.name) + '</span>' +
          '<span class="row-sub">' + esc(m.line) + ' · SN ' + esc(m.sn) + '</span></span>' +
        caretSvg +
      '</button></div>';
  }

  function typeBlock() {
    var cards = TYPES.map(function (t) {
      var on = draft.type === t.value;
      return '<label class="radio-card' + (on ? ' is-selected' : '') + '" data-val="' + esc(t.value) + '">' +
          '<input type="radio" name="requestType" value="' + esc(t.value) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="radio-mark" aria-hidden="true"></span>' +
          '<span class="radio-body"><span class="radio-title">' + esc(t.value) + '</span>' +
            '<span class="radio-sub">' + esc(t.sub) + '</span></span>' +
        '</label>';
    }).join('');
    return '<div class="field">' +
        '<span class="field-label" id="typeLabel">Request type' + REQ + '</span>' +
        '<div class="radio-cards" id="typeCards" role="radiogroup" aria-labelledby="typeLabel">' + cards + '</div>' +
        '<p class="field-error" id="typeErr" hidden>Choose a request type.</p>' +
      '</div>';
  }

  function titleBlock() {
    return '<div class="field">' +
        '<label class="field-label" for="titleText">Title' + REQ + '</label>' +
        '<input type="text" class="field-input" id="titleText" placeholder="Write a short title" ' +
          'value="' + esc(draft.title || '') + '" aria-describedby="titleErr">' +
        '<p class="field-error" id="titleErr" hidden>Add a short title.</p>' +
      '</div>';
  }

  function descBlock() {
    return '<div class="field">' +
        '<label class="field-label" for="descText">Problem description' + REQ + '</label>' +
        '<textarea class="field-input" id="descText" ' +
          'placeholder="Describe the issue in detail — noise, leak, error code, when it started…" ' +
          'aria-describedby="descErr">' + esc(draft.description || '') + '</textarea>' +
        '<p class="field-error" id="descErr" hidden>Describe the issue so Service knows what to look at.</p>' +
      '</div>';
  }

  function attachBlock() {
    var n = draft.photos || 0;
    var title = n ? (n + (n === 1 ? ' photo attached' : ' photos attached')) : 'Add a photo of the problem';
    var sub = n ? 'Tap to add more' : 'A photo often says more than a paragraph';
    return '<div class="field">' +
      '<span class="field-label">Attachments</span>' +
      '<div class="card"><a class="row" id="attachRow" href="capture.html?target=new-service">' +
        '<span class="row-icon" aria-hidden="true">' + camSvg + '</span>' +
        '<span class="row-body"><span class="row-title">' + esc(title) + '</span>' +
          '<span class="row-sub">' + esc(sub) + '</span></span>' +
        chevron +
      '</a></div></div>';
  }

  function renderForm() {
    var m = resolveMachine(draft.machine);
    document.title = 'New service request — NETZSCH Customer Portal';
    app.innerHTML =
      M.ctxCard({ title: 'New service request', sub: 'For ' + m.name + ' · ' + m.line }) +
      machineBlock() +
      '<h2>Service details</h2>' +
      typeBlock() +
      titleBlock() +
      descBlock() +
      attachBlock() +
      '<div class="actions" style="margin-top:20px">' +
        '<button type="button" class="btn btn-primary btn-full" id="submit">' + sendSvg + 'Send request</button>' +
      '</div>';
    wireForm();
  }

  function wireForm() {
    document.getElementById('machineTrigger').addEventListener('click', openSheet);

    /* Radio cards: seleção nativa (teclado/leitor de tela via <input radio>), com
       o realce do card atualizado em runtime — sem re-render, preserva o que foi
       digitado nos campos. */
    document.getElementById('typeCards').addEventListener('change', function (e) {
      var input = e.target.closest('input[type="radio"]');
      if (!input) return;
      draft.type = input.value;
      saveDraft();
      Array.prototype.forEach.call(this.querySelectorAll('.radio-card'), function (c) {
        c.classList.toggle('is-selected', c.getAttribute('data-val') === draft.type);
      });
      document.getElementById('typeErr').hidden = true;
    });

    var titleEl = document.getElementById('titleText');
    titleEl.addEventListener('input', function () {
      draft.title = titleEl.value; saveDraft();
      if (titleEl.value.trim()) document.getElementById('titleErr').hidden = true;
    });

    var descEl = document.getElementById('descText');
    descEl.addEventListener('input', function () {
      draft.description = descEl.value; saveDraft();
      if (descEl.value.trim()) document.getElementById('descErr').hidden = true;
    });

    /* Antes de ir à câmera, garante o rascunho salvo (a foto volta e o form se
       reconstrói a partir dele). */
    document.getElementById('attachRow').addEventListener('click', saveDraft);

    document.getElementById('submit').addEventListener('click', onSubmit);
  }

  function onSubmit() {
    var titleEl = document.getElementById('titleText');
    var descEl = document.getElementById('descText');
    var firstBad = null;

    if (!draft.type) {
      document.getElementById('typeErr').hidden = false;
      firstBad = firstBad || document.querySelector('#typeCards input[type="radio"]');
    }
    if (!titleEl.value.trim()) {
      document.getElementById('titleErr').hidden = false;
      firstBad = firstBad || titleEl;
    }
    if (!descEl.value.trim()) {
      document.getElementById('descErr').hidden = false;
      firstBad = firstBad || descEl;
    }
    if (firstBad) { firstBad.focus(); return; }

    draft.title = titleEl.value.trim();
    draft.description = descEl.value.trim();
    saveDraft();
    recordSubmitted();
    renderDone();
  }

  /* Grava o chamado enviado para ele aparecer na lista (services.html) — fecha o
     loop do novo chamado. Dedup por id (reenvio/refresh não duplica). Data do
     dia formatada no cliente. */
  function recordSubmitted() {
    var m = resolveMachine(draft.machine);
    var rec = {
      id: NEW_ID, date: fmtToday(), type: draft.type, title: draft.title,
      status: 'submitted', machine: draft.machine, desc: draft.description
    };
    try {
      var arr = JSON.parse(sessionStorage.getItem('cp_submitted') || '[]') || [];
      arr = arr.filter(function (x) { return x.id !== NEW_ID; });
      arr.push(rec);
      sessionStorage.setItem('cp_submitted', JSON.stringify(arr));
    } catch (e) {}
  }
  function fmtToday() {
    try {
      return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) { return ''; }
  }

  /* ── confirmação ── */
  function renderDone() {
    var m = resolveMachine(draft.machine);
    var photos = draft.photos || 0;
    var photoLine = photos
      ? '<div class="callout" style="margin-top:14px"><strong>' + photos +
          (photos === 1 ? ' photo' : ' photos') + ' attached.</strong> They appear on the request at your desk.</div>'
      : '';

    document.title = 'Request submitted — NETZSCH Customer Portal';
    app.innerHTML =
      '<div class="card"><div class="result" role="status" aria-live="polite">' +
        '<span class="result-ico is-ok" aria-hidden="true">' + okSvg + '</span>' +
        '<h3>Service request submitted</h3>' +
        '<p>Request <strong>' + esc(NEW_ID) + '</strong> is with NETZSCH. They&rsquo;ll confirm and assign a technician.</p>' +
      '</div></div>' +
      photoLine +
      '<h2>Summary</h2>' +
      M.specs([
        ['Request ID', NEW_ID],
        ['Type', draft.type],
        ['Title', draft.title],
        ['Machine', m.name],
        ['Serial number', m.sn],
        ['Service by', serviceBy(m)]
      ]) +
      '<h2>Reference</h2>' +
      '<div class="card"><div class="row">' +
        '<span class="row-body"><span class="row-title" style="font-variant-numeric:tabular-nums">' +
          esc(NEW_ID) + '</span><span class="row-sub">Quote this when you contact NETZSCH</span></span>' +
        '<button type="button" class="btn copy" data-copy="' + esc(NEW_ID) + '" ' +
          'aria-label="Copy request number">Copy</button>' +
      '</div></div>' +
      '<div class="actions" style="margin-top:20px">' +
        '<a class="btn btn-primary btn-full" href="service.html?id=' + esc(NEW_ID) + '">View request</a>' +
        '<a class="btn btn-full" href="services.html">All requests</a>' +
      '</div>';

    clearDraft();
    window.scrollTo(0, 0);
  }

  /* "Service by" vem da ficha rica quando existe (Zeta 60 / Discus 30); as demais
     seguem o padrão NEM do portal. */
  function serviceBy(m) {
    if (m.info) {
      for (var i = 0; i < m.info.length; i++) {
        if (m.info[i][0] === 'Service by') return m.info[i][1];
      }
    }
    return 'NEM';
  }

  /* ── bottom sheet: máquina ── */
  var sheet = document.getElementById('sheet');
  var sheetQuery = '';

  function machineOptions() {
    return (CP.fleet || [resolveMachine(draft.machine)]).filter(function (m) {
      if (!sheetQuery) return true;
      return (m.name + ' ' + m.line + ' ' + m.sn).toLowerCase().indexOf(sheetQuery) > -1;
    });
  }
  function buildSheet() {
    document.getElementById('sheetList').innerHTML = machineOptions().map(function (m) {
      return '<button type="button" class="sheet-item' + (m.id === draft.machine ? ' is-active' : '') +
          '" data-val="' + esc(m.id) + '">' + checkIcon +
          '<span class="sheet-item-label">' + esc(m.name) +
            '<span style="display:block;font-size:12.5px;color:var(--ink-2);font-weight:400">' +
            esc(m.line) + ' · SN ' + esc(m.sn) + '</span></span>' +
        '</button>';
    }).join('');
  }
  function openSheet() {
    sheetQuery = '';
    var sw = document.getElementById('sheetSearch'); if (sw) sw.value = '';
    document.getElementById('sheetSearchWrap').hidden = (CP.fleet || []).length <= 8;
    buildSheet();
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    var t = document.getElementById('machineTrigger'); if (t) t.focus();
  }

  sheet.querySelector('.sheet-close').addEventListener('click', closeSheet);
  sheet.querySelector('.sheet-overlay').addEventListener('click', closeSheet);
  document.getElementById('sheetList').addEventListener('click', function (e) {
    var btn = e.target.closest('.sheet-item');
    if (!btn) return;
    draft.machine = btn.getAttribute('data-val');
    saveDraft();
    closeSheet();
    renderForm();
  });
  document.getElementById('sheetSearch').addEventListener('input', function (e) {
    sheetQuery = e.target.value.trim().toLowerCase();
    buildSheet();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  renderForm();
})();
</script>
</body>
</html>
