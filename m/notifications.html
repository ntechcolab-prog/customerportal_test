<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Notifications — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar" data-nav="notifications">
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main>
  <div id="head"></div>

  <button type="button" class="filter-trigger" id="typeTrigger" aria-haspopup="dialog" style="margin-top:16px">
    <svg class="ft-funnel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
    <span class="ft-label">Type:</span>
    <span class="ft-value" id="typeValue">All</span>
    <svg class="ft-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <h2><span id="count"></span></h2>
  <div id="list"></div>
</main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<div class="sheet" id="typeSheet" aria-hidden="true">
  <div class="sheet-overlay"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Filter by type">
    <span class="sheet-grip" aria-hidden="true"></span>
    <div class="sheet-head">
      <span class="sheet-title">Filter by type</span>
      <button type="button" class="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var TYPES = [
    { key: 'all',       label: 'All' },
    { key: 'approvals', label: 'Approvals' },
    { key: 'orders',    label: 'Orders' },
    { key: 'quotes',    label: 'Quotes' },
    { key: 'contracts', label: 'Contracts' },
    { key: 'services',  label: 'Service' }
  ];
  var LABEL = {};
  TYPES.forEach(function (t) { LABEL[t.key] = t.label; });
  var SINGULAR = { approvals: 'Approval', orders: 'Order', quotes: 'Quote', contracts: 'Contract', services: 'Service' };

  var items = CP.notifications;
  var unread = items.filter(function (n) { return n.unread; }).length;
  var filter = 'all';

  $('head').innerHTML = M.ctxCard({
    title: 'Notifications',
    sub: unread + ' unread · ' + items.length + ' total'
  });

  var chevron =
    '<svg viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';

  /* Link da notificação: usa o `to` explícito; senão, se o título traz um nº de
     pedido que existe na listagem, abre a order correspondente. */
  function linkOf(n) {
    if (n.to) return n.to;
    var mm = /#(\d{6,}-\d+)/.exec(n.title);
    if (mm && (CP.orders || []).some(function (o) { return o.id === mm[1]; })) {
      return 'order.html?id=' + encodeURIComponent(mm[1]);
    }
    return null;
  }

  var checkIcon =
    '<svg class="sheet-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  function typeCount(key) {
    return key === 'all' ? items.length : items.filter(function (n) { return n.type === key; }).length;
  }

  function item(n) {
    var open = linkOf(n);
    var tag = open ? 'a' : 'div';
    var attrs = open ? ' href="' + M.esc(open) + '"' : '';
    return '<' + tag + ' class="notif-item' + (n.unread ? ' is-unread' : '') + '"' + attrs + '>' +
        '<div class="notif-top">' +
          (n.unread ? '<span class="notif-dot" aria-label="Unread"></span>' : '') +
          '<span class="notif-title">' + M.esc(n.title) + '</span>' +
          '<span class="notif-time">' + M.esc(n.time) + '</span>' +
        '</div>' +
        '<div class="notif-desc">' + M.esc(n.desc) + '</div>' +
        '<div class="notif-meta">' +
          '<span class="notif-type">' + M.esc(SINGULAR[n.type] || n.type) + '</span>' +
          (open
            ? '<span class="notif-go">' + chevron + '</span>'
            : '<span class="notif-portal">In the portal</span>') +
        '</div>' +
      '</' + tag + '>';
  }

  function render() {
    var found = items.filter(function (n) { return filter === 'all' || n.type === filter; });
    $('count').textContent = found.length + (found.length === 1 ? ' notification' : ' notifications');

    $('list').innerHTML = found.length
      ? '<div class="card">' + found.map(item).join('') + '</div>'
      : '<div class="card empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
          'stroke-linecap="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/>' +
          '<path d="M10 20a2 2 0 0 0 4 0"/></svg>' +
          '<h3>Nothing here</h3><p>No notifications of this type.</p>' +
        '</div>';
  }

  /* ── bottom sheet: filtro por tipo (mesmo padrão de Máquinas/Orders) ── */
  var sheet = $('typeSheet');

  function buildSheet() {
    $('sheetList').innerHTML = TYPES.map(function (t) {
      return '<button type="button" class="sheet-item' + (t.key === filter ? ' is-active' : '') +
          '" data-type="' + M.esc(t.key) + '">' + checkIcon +
          '<span class="sheet-item-label">' + M.esc(t.key === 'all' ? 'All types' : t.label) + '</span>' +
          '<span class="sheet-item-count">' + typeCount(t.key) + '</span>' +
        '</button>';
    }).join('');
  }

  function openSheet() {
    buildSheet();
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    $('typeTrigger').focus();
  }

  $('typeTrigger').addEventListener('click', openSheet);
  sheet.querySelector('.sheet-close').addEventListener('click', closeSheet);
  sheet.querySelector('.sheet-overlay').addEventListener('click', closeSheet);
  $('sheetList').addEventListener('click', function (e) {
    var btn = e.target.closest('.sheet-item');
    if (!btn) return;
    filter = btn.getAttribute('data-type');
    $('typeValue').textContent = filter === 'all' ? 'All' : LABEL[filter];
    $('typeTrigger').classList.toggle('is-active', filter !== 'all');
    closeSheet();
    render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  render();
})();
</script>
</body>
</html>
