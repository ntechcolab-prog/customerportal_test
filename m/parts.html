<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Spare parts — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Customer Portal</span>
  </span>
  <span class="topbar-tag">Phone</span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  if (M.isExpired()) { app.innerHTML = M.expiredMarkup; return; }

  var key = M.param('ctx', 'inlet-flange');
  var ctx = CP.parts[key] || CP.parts['inlet-flange'];
  var machine = CP.machines[ctx.machine];
  var isSearch = key.indexOf('search') === 0;
  document.title = ctx.title + ' — NETZSCH Customer Portal';

  app.innerHTML =
    M.ctxCard({
      title: ctx.title,
      sub: machine.name + ' · ' + ctx.sub
    }) +
    '<h2>' + (isSearch ? 'Searched for' : 'Subset') + '</h2>' +
    '<div class="callout">' + M.esc(ctx.origin) + '</div>' +
    '<h2>Parts · ' + ctx.items.length + '</h2>' +
    M.partsList(ctx.items) +
    '<h2>Machine</h2>' +
    '<div class="card">' +
      '<a class="row" href="machine.html?m=' + M.esc(machine.id) + '">' +
        '<span class="row-body"><span class="row-title">' + M.esc(machine.name) + '</span>' +
        '<span class="row-sub">' + M.esc(machine.line) + ' · SN ' + M.esc(machine.sn) + '</span></span>' +
        '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>' +
      '</a>' +
    '</div>';
})();
</script>
</body>
</html>
