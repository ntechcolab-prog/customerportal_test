<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Spare parts — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  if (M.isExpired()) { app.innerHTML = M.expiredMarkup; return; }

  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';
  var photoIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 7h3l1.7-2h6.6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>';
  var codeIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 8v8M11 8v8M14 8v8M16.5 8v8"/></svg>';

  /* Só Zeta 60 e Discus 30 têm lista de peças real no companion (copiada do
     desktop). Mapeia por MODELO para cobrir também as unidades da frota desses
     modelos. Demais modelos → finder (escanear / catálogo no desktop). */
  var MODEL_PARTS = { 'Zeta 60': 'search-zeta60', 'Discus 30': 'inlet-flange' };

  var ctxKey = M.param('ctx', '');
  var mid = M.param('m', '');
  var machine, key;

  if (ctxKey) {
    key = CP.parts[ctxKey] ? ctxKey : 'inlet-flange';
    machine = CP.machines[CP.parts[key].machine];
  } else {
    machine = CP.machines[mid];
    if (!machine && CP.fleet) {
      for (var i = 0; i < CP.fleet.length; i++) {
        if (CP.fleet[i].id === mid) { machine = CP.fleet[i]; break; }
      }
    }
    if (!machine) machine = CP.machines.zeta60;
    key = MODEL_PARTS[machine.name] || '';
  }

  var ctx = key ? CP.parts[key] : null;

  if (ctx) { renderList(); } else { renderFinder(); }

  /* Lista real: subset (handoff) ou resultados de busca. */
  function renderList() {
    var isSearch = key.indexOf('search') === 0;
    document.title = ctx.title + ' — NETZSCH Customer Portal';
    app.innerHTML =
      M.ctxCard({ title: ctx.title, sub: machine.name + ' · ' + ctx.sub }) +
      '<h2>' + (isSearch ? 'Searched for' : 'Subset') + '</h2>' +
      '<div class="callout">' + M.esc(ctx.origin) + '</div>' +
      '<h2>Parts · ' + ctx.items.length + '</h2>' +
      M.partsList(ctx.items) +
      '<h2>Machine</h2>' +
      '<div class="card"><a class="row" href="machine.html?m=' + M.esc(machine.id) + '">' +
        '<span class="row-body"><span class="row-title">' + M.esc(machine.name) + '</span>' +
        '<span class="row-sub">' + M.esc(machine.line) + ' · SN ' + M.esc(machine.sn) + '</span></span>' + chevron +
      '</a></div>';
  }

  /* Sem lista no celular: encontra a peça por scan; catálogo completo no desktop. */
  function renderFinder() {
    document.title = 'Spare parts — NETZSCH Customer Portal';
    app.innerHTML =
      M.ctxCard({ title: 'Spare parts', sub: machine.name + ' · ' + machine.line }) +
      '<div class="callout lead"><strong>No parts list on your phone yet.</strong> Find a part for ' +
        M.esc(machine.name) + ' by scanning it, or open the full catalogue on your computer.</div>' +
      '<h2>Find a part</h2>' +
      '<div class="card">' +
        '<a class="row" href="scan.html?method=photo">' +
          '<span class="row-icon" aria-hidden="true">' + photoIcon + '</span>' +
          '<span class="row-body"><span class="row-title">Search by photo</span>' +
          '<span class="row-sub">Point your phone at the part</span></span>' + chevron +
        '</a>' +
        '<a class="row" href="scan.html?method=code">' +
          '<span class="row-icon" aria-hidden="true">' + codeIcon + '</span>' +
          '<span class="row-body"><span class="row-title">Scan the product code</span>' +
          '<span class="row-sub">Read the code off the part or its plate</span></span>' + chevron +
        '</a>' +
      '</div>';
  }
})();
</script>
</body>
</html>
