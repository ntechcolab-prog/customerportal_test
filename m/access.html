<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Access request — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Customer Portal</span>
  </span>
  <span class="topbar-tag">Phone</span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var esc = M.esc;
  var X = CP.access;

  /* Deep link (CP-659): quem abriu e o estado no momento do aviso.
     ?role=  → papel de quem tocou (default: admin, o destinatário do link)
     ?state= → pending | handled (já concedido/negado por outro admin) */
  var role = M.param('role', 'admin');
  var state = M.param('state', 'pending');

  var checkSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
  var xSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  var lockSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/>' +
    '<path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>';

  function head(badgeLabel, badgeCls, who) {
    return M.ctxCard({
      from: 'Opened from a notification',
      title: X.requester,
      sub: X.roleRequested + ' role · ' + X.module,
      badge: M.badge(badgeLabel, badgeCls),
      role: who
    });
  }

  /* O que o admin precisa para julgar: quem, de onde, e qual papel está pedindo. */
  function requestSpecs() {
    return M.specs([
      ['Requester', X.requester],
      ['Department', X.dept],
      ['Company', X.company],
      ['Role requested', X.roleRequested],
      ['Access', X.module],
      ['Reference', X.ref],
      ['Requested', X.requested],
      ['Priority', X.priority]
    ]);
  }

  function result(cls, ico, title, body) {
    return '<div class="card"><div class="result" role="status">' +
        '<span class="result-ico ' + cls + '" aria-hidden="true">' + ico + '</span>' +
        '<h3>' + esc(title) + '</h3>' +
        '<p>' + body + '</p>' +
      '</div></div>';
  }

  /* ── Estados de exceção ── */

  // Link expirado.
  if (M.isExpired()) { app.innerHTML = M.expiredMarkup; return; }

  // Aberto por quem não é admin.
  if (role !== 'admin') {
    app.innerHTML =
      head('Pending', 'is-progress', CP.user.name + ' · ' + CP.user.role) +
      '<div class="card empty lead">' + lockSvg +
        '<h3>You’re not an admin</h3>' +
        '<p>Only a portal admin can grant access. Ask an administrator to review this request, or open it from an admin’s device.</p>' +
      '</div>';
    return;
  }

  // Já resolvido por outro admin (o portal só tem 1 admin nomeado, então sem nome).
  if (state === 'handled') {
    app.innerHTML =
      head('Already handled', 'is-completed', X.admin + ' · Administrator') +
      '<div class="callout is-warn lead">' +
        '<strong>This request has already been handled.</strong> ' +
        'Another admin got to it first — there’s nothing left to decide here.' +
      '</div>' +
      requestSpecs();
    return;
  }

  /* ── Fluxo normal: decidir ── */
  function render(view, reasonText) {
    var body, badge;

    if (view === 'done-grant') {
      badge = ['Granted', 'is-completed'];
      body = result('is-ok', checkSvg, 'Access granted',
        '<strong>' + esc(X.requester) + '</strong> now has the ' + esc(X.roleRequested) +
        ' role and can use the ' + esc(X.module) + '.');

    } else if (view === 'done-deny') {
      badge = ['Denied', 'is-cancelled'];
      body = result('is-no', xSvg, 'Request denied',
        '<strong>' + esc(X.requester) + '</strong>’s request was denied. ' +
        'Their current access is unchanged.') +
        (reasonText
          ? '<div class="callout is-warn"><strong>Note sent:</strong> ' + esc(reasonText) + '</div>'
          : '');

    } else if (view === 'deny') {
      badge = ['Pending', 'is-progress'];
      body =
        '<h2>Deny access request</h2>' +
        '<div class="field">' +
          '<label class="field-label" for="denyText">Reason (optional)</label>' +
          '<textarea class="field-input" id="denyText" ' +
            'placeholder="Let ' + esc(X.requester) + ' know why (optional)"></textarea>' +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn btn-danger btn-full" id="confirmDeny">Confirm denial</button>' +
          '<button type="button" class="btn btn-full" id="cancelDeny">Cancel</button>' +
        '</div>';

    } else { /* decide */
      badge = ['Pending', 'is-progress'];
      body =
        '<h2>What’s being requested</h2>' +
        requestSpecs() +
        '<div class="callout lead">' +
          '<strong>Granting</strong> gives ' + esc(X.requester) + ' the ' + esc(X.roleRequested) +
          ' role and access to the ' + esc(X.module) + '. ' +
          '<strong>Denying</strong> keeps their current access unchanged.' +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn btn-primary btn-full" id="grant">Grant access</button>' +
          '<button type="button" class="btn btn-danger btn-full" id="deny">Deny…</button>' +
        '</div>';
    }

    app.innerHTML = head(badge[0], badge[1], X.admin + ' · Administrator') + body;
    wire(view);
  }

  function wire(view) {
    if (view === 'decide') {
      document.getElementById('grant').addEventListener('click', function () {
        render('done-grant');
        window.scrollTo(0, 0);
      });
      document.getElementById('deny').addEventListener('click', function () {
        render('deny');
        var ta = document.getElementById('denyText');
        if (ta) ta.focus();
      });
      return;
    }

    if (view === 'deny') {
      document.getElementById('confirmDeny').addEventListener('click', function () {
        var reason = document.getElementById('denyText').value.trim();
        render('done-deny', reason);
        window.scrollTo(0, 0);
      });
      document.getElementById('cancelDeny').addEventListener('click', function () {
        render('decide');
      });
    }
  }

  render('decide');
})();
</script>
</body>
</html>
