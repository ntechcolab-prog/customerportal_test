<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Order — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="orders.html" aria-label="Back to orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  /* Sem ?id= cai no #06 (único com rastreio completo) — é pra onde reorder e
     scan apontam. Com ?id= abre o pedido escolhido na listagem. */
  var id = M.param('id', CP.order.id);
  var s = (CP.orders || []).filter(function (o) { return o.id === id; })[0] || null;

  function icon(paths) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
  }
  var STATE_ICON = {
    'is-progress':  icon('<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>'),                 /* clock  */
    'is-submitted': icon('<path d="M3 7.5h10v8H3z"/><path d="M13 10.5h4l3.5 3.5v2H13z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>'), /* truck */
    'is-completed': icon('<circle cx="12" cy="12" r="9"/><path d="m8.3 12.2 2.4 2.4 4.9-5.2"/>'),    /* check  */
    'is-cancelled': icon('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.2"/><path d="M12 16.2h.01"/>'), /* alert */
    '':             icon('<circle cx="12" cy="12" r="9"/><path d="m8.3 12.2 2.4 2.4 4.9-5.2"/>')     /* check (Confirmed) */
  };

  /* Bloco de status: ícone do estado num chip colorido + status + nota. Absorve
     o que antes era um callout repetindo o badge. */
  function hero(o) {
    var cls = o.cls || '';
    return '<div class="order-hero ' + cls + '">' +
        '<span class="order-hero-ic" aria-hidden="true">' + (STATE_ICON[cls] || STATE_ICON['']) + '</span>' +
        '<span class="order-hero-body">' +
          '<span class="order-hero-status">' + M.esc(o.status) + '</span>' +
          (o.note ? '<span class="order-hero-note">' + M.esc(o.note) + '</span>' : '') +
        '</span>' +
      '</div>';
  }

  function head(o, subItem) {
    var bits = [];
    if (subItem) bits.push(subItem);
    if (o.time) bits.push(o.time);
    return M.ctxCard({ title: 'Order #' + o.id, sub: bits.join(' · ') });
  }

  function specCard(pairs) {
    return '<div class="card"><dl>' + pairs.map(function (p) {
      return '<div class="spec' + (p[2] ? ' is-total' : '') + '"><dt>' + M.esc(p[0]) + '</dt><dd>' + M.esc(p[1]) + '</dd></div>';
    }).join('') + '</dl></div>';
  }

  function trackingCard(number, carrier) {
    return '<h2>Tracking number</h2>' +
      '<div class="card"><div class="row">' +
        '<span class="row-body"><span class="row-title" style="font-variant-numeric:tabular-nums">' +
          M.esc(number) + '</span>' + (carrier ? '<span class="row-sub">' + M.esc(carrier) + '</span>' : '') + '</span>' +
        '<button type="button" class="btn copy" data-copy="' + M.esc(number) + '" aria-label="Copy tracking number">Copy</button>' +
      '</div></div>';
  }

  var DESK_NOTE =
    '<p class="order-foot">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>' +
      'Full order — line items, documents and invoice — on your computer.</p>';

  /* Detalhe rico: só o #06 tem timeline + endereço + specs completos (CP.order). */
  function renderRich() {
    var o = CP.order;
    var steps = o.steps.map(function (st) {
      return '<li class="track-step' + (st.done ? ' is-done' : '') + '">' +
          '<span class="track-mark" aria-hidden="true"><span class="track-dot"></span><span class="track-line"></span></span>' +
          '<span class="track-body">' +
            '<span class="track-title">' + M.esc(st.title) + '</span>' +
            '<span class="track-note">' + M.esc(st.note) + '</span>' +
            '<span class="track-state">' + M.esc(st.state) + '</span>' +
          '</span>' +
        '</li>';
    }).join('');

    app.innerHTML =
      head(s || { id: o.id }, o.item.name) +
      (s ? hero(s) : '') +
      '<h2>Delivery</h2>' +
      '<div class="card"><ol class="track" style="list-style:none">' + steps + '</ol></div>' +
      trackingCard(o.tracking, o.carrier) +
      '<h2>Item</h2>' +
      specCard([
        ['Product', o.item.name],
        ['Ref', o.item.ref],
        ['Size', o.item.size],
        ['Quantity', o.item.qty],
        ['Unit price', o.item.unit],
        ['Order total', o.total, true]
      ]) +
      '<h2>Shipping to</h2>' +
      '<div class="callout">' + o.address.map(M.esc).join('<br>') + '</div>';
  }

  /* Detalhe leve: status + rastreio quando existe + o que o feed traz, cruzado
     com o histórico de beads (mesma order id) pra puxar referência e tamanho.
     O resto vive no computador — mesmo padrão rico/leve das máquinas. */
  function renderLight() {
    var o = s || { id: id, status: 'Order', cls: '', note: '' };
    var bead = (CP.beadOrders || []).filter(function (b) { return b.order === o.id; })[0];

    var item = [];
    if (o.item) item.push(['Product', o.item]);
    if (bead) { item.push(['Reference', bead.ref]); item.push(['Grinding media size', bead.size]); }
    if (o.total) item.push(['Order total', o.total, true]);

    var ship = [];
    if (o.carrier) ship.push(['Carrier', o.carrier]);
    if (o.eta) ship.push(['Estimated delivery', o.eta]);

    app.innerHTML =
      head(o, o.item) +
      hero(o) +
      (o.tracking ? trackingCard(o.tracking, o.carrier) : '') +
      (ship.length ? '<h2>Delivery</h2>' + specCard(ship) : '') +
      (item.length ? '<h2>Item</h2>' + specCard(item) : '') +
      DESK_NOTE;
  }

  if (id === CP.order.id || (s && s.full)) renderRich();
  else renderLight();
})();
</script>
</body>
</html>
