<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Help — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar" data-nav="help">
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main>
  <div id="head"></div>

  <h2 id="lbl-search">Search</h2>
  <div class="search">
    <input id="q" type="search" autocomplete="off" aria-labelledby="lbl-search"
           placeholder="Error code, seal, vibration…">
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>

  <h2><span id="count"></span></h2>
  <div id="list"></div>
</main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';

  var CATEGORIES = ['All', 'Service & Maintenance', 'Machine Documentation', 'Orders & Invoices', 'Customer Portal Guides'];
  var SHORT = { 'All': 'All', 'Service & Maintenance': 'Service', 'Machine Documentation': 'Machines', 'Orders & Invoices': 'Orders', 'Customer Portal Guides': 'Portal' };

  var mid = M.param('m', '');
  var machine = CP.machines[mid] || null;
  if (!machine && CP.fleet) {
    for (var fi = 0; fi < CP.fleet.length; fi++) {
      if (CP.fleet[fi].id === mid) { machine = CP.fleet[fi]; break; }
    }
  }
  var category = 'All';
  var query = '';

  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';

  /* Suporte: anexar uma foto ao ticket resolve num passo o que uma descrição
     leva três mensagens (CP-675). Aqui é a entrada da mesma captura da 673/676. */
  var supportCard =
    '<h2>Contact support</h2>' +
    '<div class="card"><a class="row" href="capture.html?target=support">' +
      '<span class="row-icon" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M4 7h3l1.7-2h6.6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>' +
      '</span>' +
      '<span class="row-body"><span class="row-title">Attach a photo to a ticket</span>' +
        '<span class="row-sub">Show the problem instead of describing it</span></span>' +
      chevron +
    '</a></div>';

  document.getElementById('head').innerHTML =
    '<div class="page-head"><h1>Help</h1><p class="page-head-sub">' +
    M.esc(machine ? machine.name + ' · ' + machine.line : 'Knowledge base · 37 articles') +
    '</p></div>' + supportCard;

  var chips = document.getElementById('chips');
  /* O chip da máquina vem primeiro: é o filtro que veio do contexto, e a faixa
     de chips rola na horizontal — no fim da fila ele passaria despercebido. */
  chips.innerHTML = (machine
    ? '<button type="button" class="chip" id="clear-machine" aria-pressed="true">' +
      M.esc(machine.name) + ' ✕</button>'
    : '') + CATEGORIES.map(function (c) {
    return '<button type="button" class="chip" data-cat="' + M.esc(c) + '" aria-pressed="' +
      (c === category) + '">' + M.esc(SHORT[c]) + '</button>';
  }).join('');

  function matches(a) {
    if (category !== 'All' && a.category !== category) return false;
    if (machine && a.machine.indexOf(machine.name) === -1 && a.machine !== 'All Machines') return false;
    if (query && (a.title + ' ' + a.category + ' ' + a.machine).toLowerCase().indexOf(query) === -1) return false;
    return true;
  }

  function render() {
    var found = CP.help.filter(matches);
    document.getElementById('count').textContent =
      found.length + (found.length === 1 ? ' article' : ' articles');

    document.getElementById('list').innerHTML = found.length
      ? '<div class="card">' + found.map(function (a) {
          return '<div class="row">' +
              '<span class="row-body">' +
                '<span class="row-title">' + M.esc(a.title) + '</span>' +
                '<span class="row-sub">' + M.esc(a.category) +
                  (a.machine ? ' · ' + M.esc(a.machine) : '') + ' · ' + M.esc(a.updated) + '</span>' +
              '</span>' +
            '</div>';
        }).join('') + '</div>'
      : '<div class="card empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
          'stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/>' +
          '<path d="m20 20-4.5-4.5"/></svg>' +
          '<h3>No articles found</h3><p>Try another word, or clear the filters above.</p>' +
        '</div>';
  }

  chips.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    if (btn.id === 'clear-machine') {
      machine = null;
      btn.remove();
      render();
      return;
    }
    category = btn.getAttribute('data-cat');
    Array.prototype.forEach.call(chips.querySelectorAll('[data-cat]'), function (c) {
      c.setAttribute('aria-pressed', String(c === btn));
    });
    render();
  });

  document.getElementById('q').addEventListener('input', function (e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  render();
})();
</script>
</body>
</html>
