<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Checkout — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="cart.html" aria-label="Back to cart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  var address = (window.CP && CP.order && CP.order.address) || ['John Doe', 'Acme Corp', 'United States'];
  var delivery = 'standard';   /* standard | pickup */
  var po = '';

  var items = M.cart.items();
  var priced = items.filter(function (p) { return M.money.isPriced(p.price); });
  var quoteItems = items.filter(function (p) { return !M.money.isPriced(p.price); });
  var subtotal = priced.reduce(function (s, p) { return s + M.money.parse(p.price) * (p.qty || 1); }, 0);
  var hasPriced = priced.length > 0;

  if (!items.length) { renderEmpty(); return; }
  app.addEventListener('click', onClick);
  app.addEventListener('input', onInput);
  render();

  function render() {
    app.innerHTML =
      '<div class="page-head"><h1>Checkout</h1>' +
        '<p class="page-head-sub">' + items.length + (items.length === 1 ? ' item' : ' items') + '</p></div>' +

      /* Shipping address */
      '<div class="co-section-title">Shipping address</div>' +
      '<div class="card"><div class="co-addr">' +
        '<div class="co-addr-name">' + M.esc(address[0]) + '</div>' +
        address.slice(1).map(function (l) { return M.esc(l); }).join('<br>') +
      '</div></div>' +

      /* Delivery method */
      '<div class="co-section-title">Delivery method</div>' +
      '<div class="co-opts">' +
        opt('standard', 'Standard delivery', '3–5 business days · to shipping address', 'Free') +
        opt('pickup', 'Pick-up at company', 'Central NY, New York', 'Free') +
      '</div>' +

      /* Payment */
      '<div class="co-section-title" style="margin-top:16px">Payment</div>' +
      '<div class="card">' +
        '<div class="co-field"><label for="po">Purchase Order Number <span style="font-weight:400;color:var(--ink-2)">(optional)</span></label>' +
          '<input class="co-input" id="po" type="text" inputmode="text" autocomplete="off" placeholder="e.g. PO-2026-0142" value="' + M.esc(po) + '"></div>' +
        '<div class="co-hint">Billed to your account · Invoice, net 30 days.</div>' +
      '</div>' +

      /* Order summary */
      '<div class="co-section-title" style="margin-top:16px">Order summary</div>' +
      '<div class="card">' +
        items.map(function (p) {
          var qty = p.qty || 1;
          var isQuote = !M.money.isPriced(p.price);
          var price = isQuote ? 'On quotation' : M.money.format(M.money.parse(p.price) * qty);
          return '<div class="co-line">' +
              '<div class="co-line-name">' + M.esc(p.name) +
                '<div class="co-line-sub">' + M.esc(p.code) + ' · Qty ' + qty + '</div></div>' +
              '<div class="co-line-price' + (isQuote ? ' quote' : '') + '">' + M.esc(price) + '</div>' +
            '</div>';
        }).join('') +
        (hasPriced
          ? '<div class="sum-row" style="margin-top:8px;border-top:1px solid var(--line-soft);padding-top:10px"><span>Subtotal</span><b>' + M.money.format(subtotal) + '</b></div>' +
            '<div class="sum-row"><span>Shipping</span><span>Free</span></div>' +
            '<div class="sum-row sum-total"><span>Total</span><b>' + M.money.format(subtotal) + '</b></div>'
          : '') +
        (quoteItems.length
          ? '<div class="co-hint">' + quoteItems.length + (quoteItems.length === 1 ? ' item is priced on quotation — NETZSCH will confirm pricing before it ships.' : ' items are priced on quotation — NETZSCH will confirm pricing before they ship.') + '</div>'
          : '') +
      '</div>' +

      '<div class="actionbar">' +
        '<button type="button" class="btn btn-primary btn-full" id="place">' +
          (hasPriced ? 'Place order' : 'Request quote') +
        '</button>' +
      '</div>' +
      '<div class="actionbar-spacer"></div>';

    syncOpts();
  }

  function opt(key, title, sub, price) {
    var sel = delivery === key;
    return '<label class="co-opt' + (sel ? ' is-sel' : '') + '" data-opt="' + key + '">' +
        '<input type="radio" name="delivery" value="' + key + '"' + (sel ? ' checked' : '') + '>' +
        '<span class="co-opt-body"><span class="co-opt-title">' + title + '</span>' +
          '<span class="co-opt-sub">' + sub + '</span></span>' +
        '<span class="co-opt-price">' + price + '</span>' +
      '</label>';
  }

  function syncOpts() {
    app.querySelectorAll('.co-opt').forEach(function (o) {
      o.classList.toggle('is-sel', o.getAttribute('data-opt') === delivery);
    });
  }

  function onInput(e) {
    if (e.target.id === 'po') po = e.target.value;
  }

  function onClick(e) {
    var o = e.target.closest('.co-opt');
    if (o) { delivery = o.getAttribute('data-opt'); syncOpts(); return; }
    if (e.target.closest('#place')) { placeOrder(); }
  }

  function nextSeq() {
    var n = parseInt(sessionStorage.getItem('cp_orderseq') || '0', 10) + 1;
    sessionStorage.setItem('cp_orderseq', String(n));
    return n;
  }

  function placeOrder() {
    var n = nextSeq();
    var deliveryLabel = delivery === 'pickup' ? 'Pick-up at company · Central NY' : 'Standard delivery';
    var shipTo = delivery === 'pickup' ? 'Central NY, New York' : address.slice(1, 3).join(', ');
    var count = items.length;
    M.cart.clear();

    if (hasPriced) {
      var orderNo = '2801' + String(48 + n).padStart(3, '0');
      renderDone({
        title: 'Order placed',
        ref: '#' + orderNo,
        refLabel: 'Order number',
        lines: [
          [count + (count === 1 ? ' item' : ' items'), M.money.format(subtotal)],
          ['Delivery', deliveryLabel],
          ['Ship to', shipTo]
        ].concat(po ? [['PO number', po]] : []),
        note: 'A confirmation was sent to your account. Track it any time under Orders.',
        cta: { href: 'orders.html', label: 'View orders' }
      });
    } else {
      var quoteRef = 'QT-2026-00' + (41 + n);
      renderDone({
        title: 'Quote requested',
        ref: quoteRef,
        refLabel: 'Quote reference',
        lines: [
          [count + (count === 1 ? ' item' : ' items'), 'Pricing to follow'],
          ['Delivery', deliveryLabel]
        ].concat(po ? [['PO number', po]] : []),
        note: 'NETZSCH will get back to you with pricing. You can follow it under Quotes.',
        cta: { href: 'quote.html', label: 'View quotes' }
      });
    }
  }

  function renderDone(o) {
    app.innerHTML =
      '<div class="card"><div class="result" role="status">' +
        '<span class="result-ico is-ok" aria-hidden="true">' + checkSvg + '</span>' +
        '<h3>' + o.title + '</h3>' +
        '<p>' + o.refLabel + ' <b>' + M.esc(o.ref) + '</b></p>' +
      '</div></div>' +
      '<div class="card">' +
        o.lines.map(function (l) {
          return '<div class="sum-row"><span>' + M.esc(l[0]) + '</span><b>' + M.esc(l[1]) + '</b></div>';
        }).join('') +
        '<div class="sum-note">' + o.note + '</div>' +
      '</div>' +
      '<div class="cap-actions">' +
        '<a class="btn btn-primary btn-full" href="' + o.cta.href + '">' + o.cta.label + '</a>' +
        '<a class="btn btn-full" href="index.html">Back to home</a>' +
      '</div>';
    window.scrollTo(0, 0);
  }

  function renderEmpty() {
    app.innerHTML =
      '<div class="page-head"><h1>Checkout</h1></div>' +
      '<div class="card empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.2 11.2a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L20 8H6.2"/></svg>' +
        '<h3>Your cart is empty</h3>' +
        '<p>Add spare parts from a machine or a search to start an order.</p>' +
      '</div>' +
      '<div class="cap-actions"><a class="btn btn-full" href="index.html">Back to home</a></div>';
  }
})();
</script>
</body>
</html>
