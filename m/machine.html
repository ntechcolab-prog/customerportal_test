<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Machine details — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="machines.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  if (M.isExpired()) { app.innerHTML = M.expiredMarkup; return; }

  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';

  var id = M.param('m', 'zeta60');
  var rich = CP.machines[id];              /* zeta60 / discus30 têm ficha completa */
  var unit = null;
  if (!rich && CP.fleet) {
    for (var i = 0; i < CP.fleet.length; i++) {
      if (CP.fleet[i].id === id) { unit = CP.fleet[i]; break; }
    }
  }

  if (rich) { render(rich, true); }
  else if (unit) { render(unit, false); }
  else { render(CP.machines.zeta60, true); }

  /* Layout único para toda máquina. Rich (zeta60/discus30) traz ficha e specs
     técnicas reais do desktop; as demais mostram a mesma estrutura com os dados
     que existem + aviso "full record on desktop" no lugar das specs técnicas. */
  function render(m, isRich) {
    document.title = m.name + ' — NETZSCH Customer Portal';
    var sub = m.line + ' · SN ' + m.sn + (m.country ? ' · ' + m.country : '');

    var onMachine = '<h2>On this machine</h2><div class="card">' +
      '<a class="row" href="parts.html?m=' + M.esc(m.id) + '">' +
        '<span class="row-body"><span class="row-title">Spare parts</span>' +
        '<span class="row-sub">Parts for this machine</span></span>' + chevron +
      '</a>' +
      '<a class="row" href="help.html?m=' + M.esc(m.id) + '">' +
        '<span class="row-body"><span class="row-title">Help for ' + M.esc(m.name) + '</span>' +
        '<span class="row-sub">Articles filtered to this machine</span></span>' + chevron +
      '</a></div>';

    var info = isRich ? m.info : [
      ['Equipment', m.name],
      ['Type', m.type],
      ['Production line', m.line],
      ['Serial Number', m.sn]
    ];

    var technical = isRich
      ? '<h2>Technical details</h2>' + M.specs(m.technical)
      : '<h2>Technical details</h2><div class="callout"><strong>Full record on your computer.</strong> ' +
        'Technical data, spare parts and documents for ' + M.esc(m.name) + ' live on the desktop portal.</div>';

    app.innerHTML =
      M.ctxCard({ title: m.name, sub: sub }) +
      onMachine +
      '<h2>Machine information</h2>' + M.specs(info) +
      technical;
  }
})();
</script>
</body>
</html>
