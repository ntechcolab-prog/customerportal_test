<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Machine details — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="machines.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </a>
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main id="app"></main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  if (M.isExpired()) { app.innerHTML = M.expiredMarkup; return; }

  var chevron =
    '<svg class="row-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg>';

  var id = M.param('m', 'zeta60');
  var rich = CP.machines[id];              /* zeta60 / discus30 têm ficha completa */
  var unit = null;
  if (!rich && CP.fleet) {
    for (var i = 0; i < CP.fleet.length; i++) {
      if (CP.fleet[i].id === id) { unit = CP.fleet[i]; break; }
    }
  }

  if (rich) { renderFull(rich); }
  else if (unit) { renderLight(unit); }
  else { renderFull(CP.machines.zeta60); }

  /* Ficha completa (as duas máquinas com dados copiados do desktop). */
  function renderFull(m) {
    document.title = m.name + ' — NETZSCH Customer Portal';
    app.innerHTML =
      M.ctxCard({
        from: M.param('from') === 'link' ? 'Opened from a link' : 'From your computer',
        title: m.name,
        sub: m.line + ' · SN ' + m.sn + ' · ' + m.country
      }) +
      '<h2>On this machine</h2>' +
      '<div class="card">' +
        '<a class="row" href="parts.html?ctx=' + M.esc(m.parts) + '">' +
          '<span class="row-body"><span class="row-title">Spare parts</span>' +
          '<span class="row-sub">' + M.esc(CP.parts[m.parts].sub) + '</span></span>' + chevron +
        '</a>' +
        '<a class="row" href="help.html?m=' + M.esc(m.id) + '">' +
          '<span class="row-body"><span class="row-title">Help for ' + M.esc(m.name) + '</span>' +
          '<span class="row-sub">Articles filtered to this machine</span></span>' + chevron +
        '</a>' +
      '</div>' +
      '<h2>Machine information</h2>' + M.specs(m.info) +
      '<h2>Technical details</h2>' + M.specs(m.technical);
  }

  /* Detalhe leve: unidade da frota sem ficha técnica completa no companion.
     Mostra o essencial e aponta o registro completo para o desktop. */
  function renderLight(f) {
    document.title = f.name + ' — NETZSCH Customer Portal';
    app.innerHTML =
      M.ctxCard({ from: 'Your equipment', title: f.name, sub: f.line + ' · SN ' + f.sn }) +
      '<h2>Machine</h2>' +
      M.specs([
        ['Equipment', f.name],
        ['Type', f.type],
        ['Production line', f.line],
        ['Serial Number', f.sn]
      ]) +
      '<div class="callout lead"><strong>Full record on your computer.</strong> Spare parts, technical ' +
        'data and documents for ' + M.esc(f.name) + ' live on the desktop portal.</div>' +
      '<h2>Help</h2>' +
      '<div class="card"><a class="row" href="help.html">' +
        '<span class="row-body"><span class="row-title">Help articles</span>' +
        '<span class="row-sub">Search the knowledge base</span></span>' + chevron +
      '</a></div>';
  }
})();
</script>
</body>
</html>
