<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Orders — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar" data-nav="orders">
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main>
  <div class="page-head">
    <h1>Orders</h1>
    <p class="page-head-sub">Track deliveries · full history on your computer</p>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
  <div id="olist"></div>
</main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';

  /* Ordena por status: In transit primeiro (o que o celular existe pra
     rastrear), depois Processing, Confirmed, Delivered, Rejected. Dentro do
     grupo mantém a ordem do feed (mais recente primeiro). */
  var PRIO = { 'is-submitted': 0, 'is-progress': 1, '': 2, 'is-completed': 3, 'is-cancelled': 4 };
  var orders = (CP.orders || []).map(function (o, i) { return { o: o, i: i }; })
    .sort(function (a, b) {
      var pa = PRIO[a.o.cls || ''], pb = PRIO[b.o.cls || ''];
      return pa === pb ? a.i - b.i : pa - pb;
    })
    .map(function (x) { return x.o; });

  /* Chips = só os status que existem de fato, na ordem de prioridade + "All". */
  var seen = {}, statuses = [];
  orders.forEach(function (o) { if (!seen[o.status]) { seen[o.status] = 1; statuses.push(o.status); } });
  var FILTERS = [{ key: 'all', label: 'All' }].concat(statuses.map(function (s) { return { key: s, label: s }; }));
  var filter = 'all';

  var chips = document.getElementById('chips');
  chips.innerHTML = FILTERS.map(function (f) {
    return '<button type="button" class="chip" data-status="' + M.esc(f.key) + '" aria-pressed="' +
      (f.key === filter) + '">' + M.esc(f.label) + '</button>';
  }).join('');

  function row(o) {
    var title = o.item || ('Order #' + o.id);
    var meta = [];
    if (o.item) meta.push('#' + o.id);          /* id só quando o título é o item */
    meta.push(o.time);
    return '<a class="order-row ' + (o.cls || '') + '" href="order.html?id=' + encodeURIComponent(o.id) + '">' +
        '<span class="order-row-top">' +
          '<span class="order-row-title">' + M.esc(title) + '</span>' +
          (o.total ? '<span class="order-row-amt">' + M.esc(o.total) + '</span>' : '') +
        '</span>' +
        '<span class="order-row-meta">' +
          '<span class="order-row-status">' + M.esc(o.status) + '</span> · ' + M.esc(meta.join(' · ')) +
        '</span>' +
      '</a>';
  }

  function render() {
    var found = orders.filter(function (o) { return filter === 'all' || o.status === filter; });
    document.getElementById('olist').innerHTML = found.length
      ? '<div class="card">' + found.map(row).join('') + '</div>'
      : '<div class="card empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5"/><path d="M12 12v9"/></svg>' +
          '<h3>Nothing here</h3><p>No orders with this status.</p>' +
        '</div>';
  }

  chips.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    filter = btn.getAttribute('data-status');
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (c) {
      c.setAttribute('aria-pressed', String(c === btn));
    });
    render();
  });

  render();
})();
</script>
</body>
</html>
