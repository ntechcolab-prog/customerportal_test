<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00564e">
<title>Orders — NETZSCH Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar" data-nav="orders">
  <span class="topbar-brand">
    <img src="../assets/gd-logo-white.svg" alt="NETZSCH">
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="topbar-label">Grinding &amp; Dispersing Customer Portal</span>
  </span>
</div>

<main>
  <div class="page-head">
    <h1>Orders</h1>
    <p class="page-head-sub">Track deliveries · full history on your computer</p>
  </div>

  <button type="button" class="filter-trigger" id="statusTrigger" aria-haspopup="dialog" style="margin-top:16px">
    <svg class="ft-funnel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
    <span class="ft-label">Status:</span>
    <span class="ft-value" id="statusValue">All</span>
    <svg class="ft-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <div id="list"></div>
</main>

<footer>NETZSCH Customer Portal · mobile companion</footer>

<div class="sheet" id="statusSheet" aria-hidden="true">
  <div class="sheet-overlay"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Filter by status">
    <span class="sheet-grip" aria-hidden="true"></span>
    <div class="sheet-head">
      <span class="sheet-title">Filter by status</span>
      <button type="button" class="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* Ordena por status: In transit primeiro (o que o celular existe pra
     rastrear), depois Processing, Confirmed, Delivered, Rejected. Dentro do
     grupo mantém a ordem do feed (mais recente primeiro). */
  var PRIO = { 'is-submitted': 0, 'is-progress': 1, '': 2, 'is-completed': 3, 'is-cancelled': 4 };
  var orders = (CP.orders || []).map(function (o, i) { return { o: o, i: i }; })
    .sort(function (a, b) {
      var pa = PRIO[a.o.cls || ''], pb = PRIO[b.o.cls || ''];
      return pa === pb ? a.i - b.i : pa - pb;
    })
    .map(function (x) { return x.o; });

  /* Só os status que existem de fato, na ordem de prioridade. */
  var seen = {}, statuses = [];
  orders.forEach(function (o) { if (!seen[o.status]) { seen[o.status] = 1; statuses.push(o.status); } });

  var status = 'All';

  var checkIcon =
    '<svg class="sheet-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  function statusCount(s) {
    return s === 'All' ? orders.length : orders.filter(function (o) { return o.status === s; }).length;
  }

  function row(o) {
    var title = o.item || ('Order #' + o.id);
    var meta = [];
    if (o.item) meta.push('#' + o.id);          /* id só quando o título é o item */
    meta.push(o.time);
    return '<a class="order-row ' + (o.cls || '') + '" href="order.html?id=' + encodeURIComponent(o.id) + '">' +
        '<span class="order-row-top">' +
          '<span class="order-row-title">' + M.esc(title) + '</span>' +
          (o.total ? '<span class="order-row-amt">' + M.esc(o.total) + '</span>' : '') +
        '</span>' +
        '<span class="order-row-meta">' +
          '<span class="order-row-status">' + M.esc(o.status) + '</span> · ' + M.esc(meta.join(' · ')) +
        '</span>' +
      '</a>';
  }

  function render() {
    var found = orders.filter(function (o) { return status === 'All' || o.status === status; });
    $('list').innerHTML = found.length
      ? '<div class="card">' + found.map(row).join('') + '</div>'
      : '<div class="card empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5"/><path d="M12 12v9"/></svg>' +
          '<h3>Nothing here</h3><p>No orders with this status.</p>' +
        '</div>';
  }

  /* ── bottom sheet: seleção de status (mesmo padrão das Máquinas) ── */
  var sheet = $('statusSheet');

  function buildSheet() {
    var opts = ['All'].concat(statuses);
    $('sheetList').innerHTML = opts.map(function (s) {
      return '<button type="button" class="sheet-item' + (s === status ? ' is-active' : '') +
          '" data-status="' + M.esc(s) + '">' + checkIcon +
          '<span class="sheet-item-label">' + M.esc(s === 'All' ? 'All statuses' : s) + '</span>' +
          '<span class="sheet-item-count">' + statusCount(s) + '</span>' +
        '</button>';
    }).join('');
  }

  function openSheet() {
    buildSheet();
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    $('statusTrigger').focus();
  }

  $('statusTrigger').addEventListener('click', openSheet);
  sheet.querySelector('.sheet-close').addEventListener('click', closeSheet);
  sheet.querySelector('.sheet-overlay').addEventListener('click', closeSheet);
  $('sheetList').addEventListener('click', function (e) {
    var btn = e.target.closest('.sheet-item');
    if (!btn) return;
    status = btn.getAttribute('data-status');
    $('statusValue').textContent = status;
    $('statusTrigger').classList.toggle('is-active', status !== 'All');
    closeSheet();
    render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  render();
})();
</script>
</body>
</html>
