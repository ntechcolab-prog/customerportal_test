    <text x="1080" y="3190" font-size="13" fill="#a9adb0">Contact Our Team</text>
    <circle cx="1090" cy="3222" r="15" fill="#3c4146"/>
    <circle cx="1128" cy="3222" r="15" fill="#3c4146"/>

    <line x1="120" y1="3272" x2="1320" y2="3272" stroke="#3c4146" stroke-width="1"/>
